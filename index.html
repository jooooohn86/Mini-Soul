<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
body{display:flex;justify-content:center;align-items:center}
canvas{display:block;image-rendering:pixelated;touch-action:none;outline:none}
#qr-btn{position:fixed;top:10px;right:10px;background:#111;border:1px solid #444;color:#aaa;font-size:11px;font-family:'Courier New',monospace;padding:5px 8px;cursor:pointer;border-radius:3px;z-index:100}
#qr-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;justify-content:center;align-items:center;flex-direction:column;gap:12px}
#qr-overlay.show{display:flex}
#qr-box{background:#111;border:1px solid #333;padding:20px;border-radius:6px;text-align:center}
#qr-box p{color:#888;font-family:'Courier New',monospace;font-size:10px;margin-top:10px}
#qr-close{background:transparent;border:1px solid #444;color:#888;font-family:'Courier New',monospace;font-size:11px;padding:5px 16px;cursor:pointer;border-radius:3px;margin-top:4px}
</style></head><body>
<canvas id="c" tabindex="0"></canvas>
<button id="qr-btn">QR</button>
<div id="qr-overlay"><div id="qr-box"><div id="qr-code"></div><p id="qr-url"></p><button id="qr-close">닫기</button></div></div>
<script>
(function(){
  let gen=false;
  document.getElementById('qr-btn').onclick=()=>{
    if(!gen){const u=location.href;new QRCode(document.getElementById('qr-code'),{text:u,width:180,height:180,colorDark:'#fff',colorLight:'#111'});document.getElementById('qr-url').textContent=u.length>44?u.slice(0,44)+'…':u;gen=true;}
    document.getElementById('qr-overlay').classList.add('show');
  };
  document.getElementById('qr-close').onclick=()=>document.getElementById('qr-overlay').classList.remove('show');
  document.getElementById('qr-overlay').onclick=e=>{if(e.target===document.getElementById('qr-overlay'))document.getElementById('qr-overlay').classList.remove('show');};
})();
</script>
<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// BGM 시스템 (단 한 곳에만 정의)
// music/title.mp3   : 타이틀 화면
// music/combat.mp3  : 캐릭터선택~전투~업그레이드 (루프)
// music/boss.mp3    : 보스전 (루프)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const BGM={title:null,combat:null,boss:null};
let _bgmKey=null;   // 현재 재생 키
let _bgmMuted=false;
const _bgmVol=0.35;

function _loadBgm(){
  ['title','combat','boss'].forEach(k=>{
    const a=new Audio();a.loop=true;a.volume=_bgmVol;
    a.src='music/'+k+'.mp3';
    a.addEventListener('error',()=>{BGM[k]=null;},{once:true});
    BGM[k]=a;
  });
}

// key: 'title'|'combat'|'boss'|null(=stop)
function setBgm(key){
  if(_bgmKey===key)return;          // 같은 트랙이면 아무것도 안 함
  // 현재 트랙 정지
  if(_bgmKey&&BGM[_bgmKey]){BGM[_bgmKey].pause();BGM[_bgmKey].currentTime=0;}
  _bgmKey=key;
  if(!key)return;                   // null → 정지만
  const t=BGM[key];if(!t)return;
  t.volume=_bgmMuted?0:_bgmVol;
  t.currentTime=0;
  const p=t.play();if(p)p.catch(()=>{});
}

function toggleBgmMute(){
  _bgmMuted=!_bgmMuted;
  Object.values(BGM).forEach(a=>{if(a)a.volume=_bgmMuted?0:_bgmVol;});
}
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const cv=document.getElementById('c'),cx=cv.getContext('2d');
const W=450,H=800,UI_Y=575;
cv.width=W;cv.height=H;

function resizeCanvas(){const vw=window.innerWidth,vh=window.innerHeight,scale=Math.min(vw/W,vh/H);cv.style.width=Math.floor(W*scale)+'px';cv.style.height=Math.floor(H*scale)+'px';}
resizeCanvas();window.addEventListener('resize',resizeCanvas);cv.focus();cx.imageSmoothingEnabled=false;

const AR={x:20,y:55,w:410,h:480};
const K={},JP={},M={x:0,y:0,ck:false};
cv.addEventListener('keydown',e=>{if(!K[e.code])JP[e.code]=1;K[e.code]=1;e.preventDefault();});
cv.addEventListener('keyup',e=>{delete K[e.code];});
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();M.x=(e.clientX-r.left)*(W/r.width);M.y=(e.clientY-r.top)*(H/r.height);});
cv.addEventListener('mousedown',e=>{const r=cv.getBoundingClientRect();M.x=(e.clientX-r.left)*(W/r.width);M.y=(e.clientY-r.top)*(H/r.height);M.ck=true;});
function tPos(t){const r=cv.getBoundingClientRect();return{x:(t.clientX-r.left)*(W/r.width),y:(t.clientY-r.top)*(H/r.height)};}

const f=(t,x,y,c='#ccc',s=12,a='left')=>{cx.fillStyle=c;cx.font=`${s}px Courier New`;cx.textAlign=a;cx.fillText(t,x,y);};
const bx=(x,y,w,h,fc,sc,lw=1)=>{if(fc){cx.fillStyle=fc;cx.fillRect(x,y,w,h);}if(sc){cx.strokeStyle=sc;cx.lineWidth=lw;cx.strokeRect(x,y,w,h);}};
const inR=(x,y,w,h)=>M.x>=x&&M.x<=x+w&&M.y>=y&&M.y<=y+h;
const ckR=(x,y,w,h)=>M.ck&&inR(x,y,w,h);
function bar(x,y,w,h,r,fg,bg){cx.fillStyle=bg;cx.fillRect(x,y,w,h);cx.fillStyle=fg;cx.fillRect(x,y,Math.max(0,Math.min(1,r))*w,h);cx.strokeStyle='#333';cx.lineWidth=1;cx.strokeRect(x,y,w,h);}
function btn(x,y,w,h,lb,fc='#aaf',hc='#aaaaff',bc='#448'){
  const hv=inR(x,y,w,h);bx(x,y,w,h,hv?'#1c1c55':'#10102c',hv?hc:bc,hv?2:1);
  f(lb,x+w/2,y+h/2+5,hv?hc:fc,13,'center');return ckR(x,y,w,h);
}
function hexRgba(hex,a){const h=hex.replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return`rgba(${r},${g},${b},${a})`;}

const CHARS=[
  {id:'warrior',name:'워리어',sym:'■',desc:['근거리 탱커','패링·방어로 버티며','강력한 일격을 노린다','[Shift] 넉백 (MP 30%)'],col:'#e05555',hi:'#ff9999',atkMode:'melee',base:{maxHp:150,atk:20,def:45,atkCd:650,maxSt:80,stReg:15,maxMp:100,mpReg:5,spd:2.5,rng:55,pSpd:0,pCost:30,parW:150},stars:{HP:5,공격:4,방어:5,속도:2,스태미너:3,마력:2}},
  {id:'mage',name:'메이지',sym:'◈',desc:['원거리 마법사','거리를 유지하며','마법을 구사한다','[Shift 홀드] 레이저 (MP 40%/s)'],col:'#aa55ee',hi:'#cc88ff',atkMode:'ranged',base:{maxHp:60,atk:14,def:14,atkCd:900,maxSt:80,stReg:15,maxMp:120,mpReg:12,spd:2.4,rng:165,pSpd:5,pCost:30,parW:150},stars:{HP:2,공격:3,방어:2,속도:2,스태미너:3,마력:5}},
  {id:'assassin',name:'어쌔신',sym:'◆',desc:['중거리 기동전','빠른 연속 공격으로','적을 제압한다','[Shift] 3타 연속 (MP 30%)'],col:'#44cc77',hi:'#88ffaa',atkMode:'melee',base:{maxHp:100,atk:10,def:30,atkCd:460,maxSt:100,stReg:22,maxMp:100,mpReg:5,spd:2.8,rng:90,pSpd:2.5,pCost:25,parW:150},stars:{HP:3,공격:3,방어:3,속도:4,스태미너:4,마력:3}}
];
function isMelee(p){const c=CHARS.find(x=>x.id===p.cid);return c?c.atkMode==='melee':p.pSpd===0;}

const SPR_CFG={
  warrior:{src:'sprites/warrior.png',sheet:{cols:4,rows:5,cropX:2,cropY:78},anims:{idle:{frames:2,fps:3,loop:true,indices:[0,1]},attack:{frames:6,fps:10,loop:false,indices:[4,5,6,7,8,9]},block:{frames:1,fps:1,loop:true,indices:[10]},hurt:{frames:2,fps:8,loop:false,indices:[18,19]},dodge:{frames:2,fps:10,loop:false,indices:[14,15]}},targetH:40},
  mage:{src:'sprites/mage.png',sheet:{cols:4,rows:4,cropX:0,cropY:0},chromaKey:'#f2f2f2',chromaTol:20,anims:{idle:{frames:2,fps:3,loop:true,indices:[0,3]},attack:{frames:5,fps:11,loop:false,indices:[1,2,3,4,5]},block:{frames:1,fps:1,loop:true,indices:[8]},hurt:{frames:2,fps:8,loop:false,indices:[14,15]},dodge:{frames:2,fps:10,loop:false,indices:[9,10]}},targetH:40},
  assassin:{src:'sprites/assassin.png',sheet:{cols:3,rows:4,cropX:0,cropY:0},anims:{idle:{frames:2,fps:4,loop:true,indices:[0,3]},attack:{frames:5,fps:16,loop:false,indices:[1,2,4,5,7]},block:{frames:1,fps:1,loop:true,indices:[4]},hurt:{frames:2,fps:10,loop:false,indices:[10,11]},dodge:{frames:2,fps:14,loop:false,indices:[8,9]}},targetH:40}
};
const SPR={};let SPR_READY=false;
const ENEMY_SPR_CFG={small:{src:'sprites/enemy_small.png',targetH:28,cols:4,rows:5},large:{src:'sprites/enemy_large.png',targetH:36,cols:3,rows:4},boss:{src:'sprites/enemy_boss.png',targetH:64,cols:3,rows:4}};
const ENEMY_SPR={};let ENEMY_SPR_READY=false;
const BG_IMG={forest:null,fire:null,abyss:null};
function loadBgImages(){
  const load=(key,src)=>new Promise(resolve=>{const img=new Image();img.onload=()=>{BG_IMG[key]=img;resolve();};img.onerror=()=>resolve();img.src=src;});
  return Promise.all([load('forest','sprites/bg_forest.png'),load('fire','sprites/bg_fire.png'),load('abyss','sprites/bg_abyss.png')]);
}
function getBgImg(){return BG_IMG[G.stage<=3?'forest':G.stage<=6?'fire':'abyss'];}
function loadEnemySprite(id,cfg){
  return new Promise(resolve=>{if(!cfg.src){ENEMY_SPR[id]=null;resolve();return;}const img=new Image();img.onload=()=>{const fw=img.width/cfg.cols,fh=img.height/cfg.rows;ENEMY_SPR[id]={img,w:fw,h:fh,targetH:cfg.targetH||40};resolve();};img.onerror=()=>{ENEMY_SPR[id]=null;resolve();};img.src=cfg.src;});
}
function initEnemySprites(){return Promise.all(Object.keys(ENEMY_SPR_CFG).map(id=>loadEnemySprite(id,ENEMY_SPR_CFG[id]))).then(()=>{ENEMY_SPR_READY=true;});}

function px(g,x,y,c,w=1,h=1){g.fillStyle=c;g.fillRect(x,y,w,h);}
function drawWarriorFrame(g,fi,row,col,body,hi){const cx=16,cy=26,bob=row===0?Math.sin(fi*Math.PI)*1:0;px(g,cx-4,cy-10+bob,body,8,10);px(g,cx-3,cy-18+bob,body,6,6);px(g,cx-2,cy-20+bob,'#ffccaa',4,3);let sa=-1.1;if(row===1)sa=-1.4+fi/5*2.6;else if(row===2){sa=-.3;px(g,cx-10,cy-12+bob,'#6688ff',6,12);}else if(row===3)px(g,cx-6,cy-8+bob,body,4,3);else if(row===4)px(g,cx+2,cy-6+bob,body,3,8);g.save();g.translate(cx,cy-8+bob);g.rotate(sa);px(g,-2,-1,'#8a6a3a',4,3);px(g,2,-1,'#ddd',14,2);px(g,15,-2,hi,4,4);g.restore();}
function drawMageFrame(g,fi,row,col,body,hi){const cx=16,cy=26,bob=row===0?Math.sin(fi*Math.PI)*1:0;px(g,cx-4,cy-10+bob,'#4a3070',8,10);px(g,cx-3,cy-18+bob,body,6,6);px(g,cx-2,cy-20+bob,'#ffccaa',4,3);let staffA=-.5,orb=false;if(row===1){const t=fi/4;staffA=-1.2+t*1.4;orb=t>.45;px(g,cx+8+fi*2,cy-16+bob-t*4,hi,3,3);}else if(row===2){px(g,cx-9,cy-14+bob,hi,4,14);}else if(row===4){px(g,cx+3,cy-8+bob,body,3,6);}g.save();g.translate(cx,cy-6+bob);g.rotate(staffA);px(g,-1,-1,'#5a4030',3,14);px(g,-2,-14,hi,5,5);if(orb){g.fillStyle=hi;g.globalAlpha=.5;g.beginPath();g.arc(12,-12,5,0,Math.PI*2);g.fill();g.globalAlpha=1;}g.restore();}
function drawAssassinFrame(g,fi,row,col,body,hi){const cx=16,cy=26,bob=row===0?Math.sin(fi*Math.PI)*1.2:0;px(g,cx-3,cy-10+bob,body,6,9);px(g,cx-2,cy-17+bob,body,4,5);px(g,cx-1,cy-19+bob,'#ffccaa',3,3);let da=-.8;if(row===1){da=-1.5+fi/4*2.2;}else if(row===2){px(g,cx-8,cy-11+bob,'#55aa77',5,10);}g.save();g.translate(cx+4,cy-8+bob);g.rotate(da);px(g,0,0,'#aaa',10,2);px(g,8,-1,hi,3,3);g.translate(-8,2);g.rotate(-da*.6);px(g,0,0,'#aaa',8,2);g.restore();}
const PLACE_ROW={idle:{row:0,frames:2,fps:4,loop:true},attack:{row:1,frames:6,fps:14,loop:false},block:{row:2,frames:1,fps:1,loop:true},hurt:{row:3,frames:2,fps:10,loop:false},dodge:{row:4,frames:2,fps:12,loop:false}};
function buildPlaceholder(id,cfg){
  const ch=CHARS.find(c=>c.id===id),body=ch.col,hi=ch.hi;const fw=cfg.fw||32,fh=cfg.fh||32;
  const anims={};for(const k of Object.keys(cfg.anims))anims[k]={...PLACE_ROW[k],...cfg.anims[k],row:PLACE_ROW[k]?.row??0};
  const cols=Math.max(...Object.values(anims).map(a=>a.frames));
  const oc=document.createElement('canvas');oc.width=fw*cols;oc.height=fh*5;
  const g=oc.getContext('2d');g.imageSmoothingEnabled=false;
  const draw=id==='warrior'?drawWarriorFrame:id==='mage'?drawMageFrame:drawAssassinFrame;
  for(const[,def]of Object.entries(anims)){for(let fi=0;fi<def.frames;fi++){g.clearRect(fi*fw,def.row*fh,fw,fh);g.save();g.translate(fi*fw,def.row*fh);draw(g,fi,def.row,fi,body,hi);g.restore();}}
  return{img:oc,fw,fh,anims,sheetCols:cols,cropX:0,cropY:0,placeholder:true};
}
function animLen(def){return def.indices?def.indices.length:def.frames;}
function parseRgb(hex){const h=(hex||'#000').replace('#','');return parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);}
function applyChroma(img,keyHex,tol){
  try{const rgb=parseRgb(keyHex),r0=rgb>>16&255,g0=rgb>>8&255,b0=rgb&255,t=tol??14;
    const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const g=c.getContext('2d');g.drawImage(img,0,0);
    const id=g.getImageData(0,0,c.width,c.height),d=id.data;
    for(let i=0;i<d.length;i+=4){if(Math.abs(d[i]-r0)<=t&&Math.abs(d[i+1]-g0)<=t&&Math.abs(d[i+2]-b0)<=t)d[i+3]=0;}
    g.putImageData(id,0,0);return c;}catch(e){return img;}
}
function loadSheet(id,cfg){
  return new Promise(resolve=>{
    const fallback=()=>{SPR[id]={...buildPlaceholder(id,cfg),anims:buildPlaceholder(id,cfg).anims,targetH:cfg.targetH||70,placeholder:true};resolve();};
    if(!cfg.src){fallback();return;}
    const img=new Image();
    img.onload=()=>{
      let tex=img;if(cfg.chromaKey)tex=applyChroma(img,cfg.chromaKey,cfg.chromaTol);
      let fw=cfg.fw||32,fh=cfg.fh||32,cropX=0,cropY=0,sheetCols=Math.max(...Object.values(cfg.anims).map(a=>animLen(a)));
      if(cfg.sheet){const s=cfg.sheet;sheetCols=s.cols;cropX=s.cropX||0;cropY=s.cropY||0;fw=s.fw||Math.floor((tex.width-cropX)/s.cols);fh=s.fh||Math.floor((tex.height-cropY)/s.rows);}
      SPR[id]={img:tex,fw,fh,anims:cfg.anims,cropX,cropY,sheetCols,targetH:cfg.targetH||70,placeholder:false};resolve();
    };
    img.onerror=()=>{fallback();};img.src=cfg.src;
  });
}
function initSprites(){return Promise.all([...Object.keys(SPR_CFG).map(id=>loadSheet(id,SPR_CFG[id])),initEnemySprites(),loadBgImages()]).then(()=>{SPR_READY=true;});}
function playerAnimName(p){if(p.state==='dead')return'idle';if(p.state==='attacking')return'attack';if(p.state==='blocking')return'block';if(p.state==='hurt')return'hurt';if(p.state==='dodging')return'dodge';return'idle';}
function playerAnimFrame(p){
  const spr=SPR[p.cid];if(!spr)return 0;const name=playerAnimName(p),def=spr.anims[name];if(!def)return 0;const n=animLen(def);
  if(name==='attack'){const dur=p.atkCd*.5,prog=Math.max(0,Math.min(1,1-p.stTm/dur));return Math.min(n-1,Math.floor(prog*n));}
  if(name==='hurt'||name==='dodge'){const dur=name==='hurt'?300:280,prog=Math.max(0,Math.min(1,1-p.stTm/dur));return Math.min(n-1,Math.floor(prog*n));}
  if(!p._anim)p._anim={name:'idle',frame:0,t:0};if(p._anim.name!==name)p._anim={name,frame:0,t:0};
  if(def.loop){p._anim.t+=G.dt;p._anim.frame=Math.floor(p._anim.t*def.fps)%n;return p._anim.frame;}return 0;
}
function drawSpriteChar(x,y,cid,anim,frame,opts={}){
  const spr=SPR[cid];if(!spr)return false;const def=spr.anims[anim]||spr.anims.idle;const fi=Math.min(frame,animLen(def)-1);let sx,sy;
  if(def.indices){const idx=def.indices[fi],col=idx%spr.sheetCols,row=Math.floor(idx/spr.sheetCols);sx=(spr.cropX||0)+col*spr.fw;sy=(spr.cropY||0)+row*spr.fh;}
  else{sx=fi*spr.fw;sy=def.row*spr.fh;}
  const th=opts.targetH||spr.targetH||70,scale=opts.scale||(th/spr.fh),flip=opts.flipX?-1:1;
  const w=spr.fw*scale,h=spr.fh*scale,foot=opts.foot??6;
  cx.save();if(opts.alpha!=null)cx.globalAlpha=opts.alpha;cx.translate(x,y);if(flip<0)cx.scale(-1,1);cx.drawImage(spr.img,sx,sy,spr.fw,spr.fh,-w/2,-h+foot,w,h);cx.restore();return true;
}
function playerGfxRadius(p){const s=SPR[p.cid];if(s&&!s.placeholder&&s.targetH)return Math.max(16,s.targetH*.4);return 14;}

const STAGE_THEMES=[{bg:'#0b170b',fl:'#132013',wl:'#091509',ac:'#44aa55'},{bg:'#170b0b',fl:'#281414',wl:'#160909',ac:'#cc4433'},{bg:'#0b0b17',fl:'#141428',wl:'#090916',ac:'#9944cc'}];
function getTheme(){return STAGE_THEMES[G.stage<=3?0:G.stage<=6?1:2];}
const BOSSES=[{name:'초원의 지배자',col:'#8B6420',hp:380,atk:20},{name:'화염의 군주',col:'#FF5500',hp:560,atk:28},{name:'심연의 어둠',col:'#7700DD',hp:750,atk:36}];
function getBossCfg(){return G.stage<=3?BOSSES[0]:G.stage<=6?BOSSES[1]:BOSSES[2];}

const UPGRADES=[
  {name:'생명력 강화',icon:'♥',desc:'최대 HP +25',tag:'공용',tc:'#55aaff',fn:p=>{p.maxHp+=25;p.hp=Math.min(p.hp+25,p.maxHp);}},
  {name:'방어력 강화',icon:'◉',desc:'방어력 +8',tag:'공용',tc:'#55aaff',fn:p=>p.def+=8},
  {name:'스태미너 강화',icon:'~',desc:'스태미너 +25',tag:'공용',tc:'#55aaff',fn:p=>p.maxSt+=25},
  {name:'빠른 회복',icon:'≈',desc:'스태미너 회복 +8',tag:'공용',tc:'#88ff44',fn:p=>p.stReg+=8},
  {name:'패링 달인',icon:'★',desc:'패링 판정 +60ms',tag:'공용',tc:'#88ff44',fn:p=>p.parW+=60},

function lerpColor(a,b,t){
  const ah=a.replace('#',''),bh=b.replace('#','');
  const ar=parseInt(ah.slice(0,2),16),ag=parseInt(ah.slice(2,4),16),ab2=parseInt(ah.slice(4,6),16);
  const br=parseInt(bh.slice(0,2),16),bg=parseInt(bh.slice(2,4),16),bb=parseInt(bh.slice(4,6),16);
  const rr=Math.round(ar+(br-ar)*t),rg=Math.round(ag+(bg-ag)*t),rb=Math.round(ab2+(bb-ab2)*t);
  return`#${rr.toString(16).padStart(2,'0')}${rg.toString(16).padStart(2,'0')}${rb.toString(16).padStart(2,'0')}`;
}

function drawFx(){
  G.fx.forEach(a=>{

    if(a.type==='slash'){const ang=Math.atan2(a.dy,a.dx),sw=Math.PI*(a.wide||1)*.72,reach=a.rng*(a.enemy?0.65:1),swing=Math.min(1,prog*2.8);cx.save();cx.globalAlpha=fade;cx.strokeStyle=a.col;cx.lineWidth=Math.max(1,4.5-prog*3);cx.lineCap='round';cx.beginPath();cx.arc(a.x,a.y,reach*.9,ang-sw/2,ang-sw/2+sw*swing);cx.stroke();cx.strokeStyle='#fff';cx.globalAlpha=fade*.45;cx.lineWidth=1.5;cx.beginPath();cx.arc(a.x,a.y,reach*.75,ang-sw/2+sw*.15,ang-sw/2+sw*swing*.85);cx.stroke();cx.fillStyle=a.col;cx.globalAlpha=fade*.18;cx.beginPath();cx.arc(a.x+a.dx*reach*.55,a.y+a.dy*reach*.55,Math.max(2,14*(1-prog)),0,Math.PI*2);cx.fill();cx.restore();}

function doPlayerSkill(p){
  if(p.state==='dead')return;
  if(p.cid==='warrior'){const mpCost=p.maxMp*0.30;if(p.mp<mpCost)return;p.mp-=mpCost;dust(p.x,p.y,'#ffcc44',18);addImpact(p.x,p.y,'#ffcc44',70);const tgts=(G.scr==='boss'?[G.boss]:G.enemies).filter(e=>e&&e.state!=='dead');tgts.forEach(e=>{const dx=e.x-p.x,dy=e.y-p.y,dist=Math.hypot(dx,dy);if(dist<92){const l=dist||1,pw=90;e.x=Math.max(AR.x+e.sz,Math.min(AR.x+AR.w-e.sz,e.x+dx/l*pw));e.y=Math.max(AR.y+e.sz,Math.min(AR.y+AR.h-e.sz,e.y+dy/l*pw));e.state='stunned';e.stTm=600;dust(e.x,e.y,'#ff8844',8);}});G.fx.push({type:'impact',x:p.x,y:p.y,col:'#ffcc44',r:92,t:320,mt:320});G.parryMsg=800;G.parryTxt='넉백!';}
  else if(p.cid==='mage'){p.skillActive=true;}
  else if(p.cid==='assassin'){const mpCost=p.maxMp*0.30;if(p.mp<mpCost)return;if(p.skillCombo>0)return;p.mp-=mpCost;p.skillCombo=3;p.skillComboTm=0;doAssassinComboHit(p);}
}
function doAssassinComboHit(p){
  if(p.skillCombo<=0||p.state==='dead')return;p.skillCombo--;const tgts=(G.scr==='boss'?[G.boss]:G.enemies).filter(e=>e&&e.state!=='dead');if(!tgts.length)return;
  let near=tgts[0],nd=Infinity;tgts.forEach(e=>{const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<nd){nd=d;near=e;}});
  const dx=near.x-p.x,dy=near.y-p.y,dist=Math.hypot(dx,dy)||1;p.face={x:dx/dist,y:dy/dist};
  addSlash(p.x,p.y,p.face.x,p.face.y,p.rng*1.1,p.hi,{wide:1.15,t:180});tgts.forEach(e=>{if(Math.hypot(e.x-p.x,e.y-p.y)<=p.rng+(e.sz||12)+10)hitE(e,p.atk*1.2);});dust(p.x,p.y,p.hi,5);if(p.skillCombo>0)p.skillComboTm=200;
}
function updMageLaser(p,dt){
  if(!p.skillActive)return;const mpDrain=p.maxMp*0.40*dt;
  if(p.mp<=mpDrain){p.mp=0;p.skillActive=false;p.skillLocked=true;return;}
  p.mp-=mpDrain;if(!p._laserTm)p._laserTm=0;p._laserTm-=dt*1000;
  if(p._laserTm<=0){p._laserTm=90;const ox=p.x+p.face.x*18,oy=p.y+p.face.y*18;firePrj(ox,oy,p.face.x,p.face.y,p.atk*0.24,9,p.hi,'player');dust(ox,oy,p.hi,3);}
  G.fx.push({type:'laser',x:p.x,y:p.y,dx:p.face.x,dy:p.face.y,col:p.hi,t:95,mt:95});
}
function drawLaserFx(){G.fx.filter(a=>a.type==='laser').forEach(a=>{const prog=1-a.t/a.mt,fade=Math.max(0,1-prog*2),len=AR.w*1.1;cx.save();cx.globalAlpha=fade*0.85;cx.strokeStyle=a.col;cx.lineWidth=6;cx.lineCap='round';cx.shadowColor=a.col;cx.shadowBlur=12;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(a.x+a.dx*len,a.y+a.dy*len);cx.stroke();cx.lineWidth=2;cx.strokeStyle='#fff';cx.globalAlpha=fade*0.5;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(a.x+a.dx*len,a.y+a.dy*len);cx.stroke();cx.shadowBlur=0;cx.restore();});}
function drawParryUI(p){

  ents.forEach(e=>{if(!e||e.state!=='windup')return;const dist=Math.hypot(p.x-e.x,p.y-e.y);if(dist>(e.atkR||50)+45)return;const parryZone=e.stTm<=Math.max(160,p.parW*.9),ex=e.x,ey=e.y,sz=e.sz||12;if(parryZone){cx.save();cx.strokeStyle='rgba(255,255,80,.85)';cx.lineWidth=2;cx.setLineDash([4,3]);cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(ex,ey);cx.stroke();cx.fillStyle='#ffff88';cx.font='bold 12px Courier New';cx.textAlign='center';cx.fillText(p.parCd>0?'쿨다운':'패링!',ex,ey-sz-24);if(p.parAct&&p.parCd<=0){cx.fillStyle='#ffffff';cx.fillText('↯',ex,ey-sz-38);}cx.restore();cx.setLineDash([]);}});
}
function updTrail(dt){G.trail.forEach(t=>t.life-=dt);G.trail=G.trail.filter(t=>t.life>0);const p=G.player;if(p&&p.state==='dodging')G.trail.push({x:p.x,y:p.y,col:p.col,life:.18,ml:.18});}
function drawTrail(){G.trail.forEach(t=>{cx.globalAlpha=t.life/t.ml*.42;cx.fillStyle=t.col;cx.fillRect(t.x-12,t.y-12,24,24);});cx.globalAlpha=1;}
function clampP(p){p.x=Math.max(AR.x+13,Math.min(AR.x+AR.w-13,p.x));p.y=Math.max(AR.y+13,Math.min(AR.y+AR.h-13,p.y));}
function hitE(e,d){if(e.state==='dead')return;e.hp-=d;e.fl=200;dust(e.x,e.y,'#ff5555',4);if(e.hp<=0){e.hp=0;e.state='dead';dust(e.x,e.y,'#ffaaaa',10);addImpact(e.x,e.y,'#ff8888');}}
function hitP(d){
  const p=G.player;if(!p||p.state==='dead'||p.inv)return;
  if(p.parAct){p.parAct=false;p.parTm=0;G.flash=80;G.parryMsg=1200;p.parBonus=true;p.parCd=300;
    if(p.cid==='warrior'){const old=p.hp;p.hp=Math.min(p.maxHp,p.hp+15);if(p.hp>old){dust(p.x,p.y,'#44ff44',10);G.parryTxt='+15 HP';}}
    else if(p.cid==='mage'){const old=p.mp;p.mp=Math.min(p.maxMp,p.mp+35);if(p.mp>old){dust(p.x,p.y,'#cc88ff',10);G.parryTxt='+35 MP';}}
    else if(p.cid==='assassin'){p.hp=Math.min(p.maxHp,p.hp+8);p.mp=Math.min(p.maxMp,p.mp+15);dust(p.x,p.y,'#88ffaa',10);G.parryTxt='+8 HP  +15 MP';}
    dust(p.x,p.y,'#ffff44',14);addImpact(p.x,p.y,'#ffff44',40);(G.scr==='boss'?[G.boss]:G.enemies).forEach(e=>{if(!e||e.state==='dead')return;if(Math.hypot(e.x-p.x,e.y-p.y)<160){e.state='stunned';e.stTm=1500;}});return;}
  if(p.state==='blocking'){p.hp-=Math.max(1,d-p.def*.8);p.st=Math.max(0,p.st-20);dust(p.x,p.y,'#4455ff',4);if(p.st<=0)p.state='idle';}
  else{p.hp-=Math.max(1,d-p.def*.3);p.state='hurt';p.stTm=300;p.inv=true;p.invTm=500;G.flash=200;dust(p.x,p.y,'#ff2222',8);addImpact(p.x,p.y,'#ff2222',35);}
  if(p.hp<=0){p.hp=0;p.state='dead';setBgm(null);setTimeout(()=>goScr('defeat'),1500);}
}
function firePrj(x,y,dx,dy,d,sp,c,ow){G.projs.push({x,y,dx,dy,d,sp:sp*200,c,ow,r:6,life:2.5,trail:[]});}

function update(){
  const dt=G.dt;
  if(G.scr==='combat'||G.scr==='boss'){updP(dt);G.scr==='combat'?updEs(dt):updB(dt);updProjs(dt);checkEnd();}
  G.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.9;p.vy*=.9;p.life-=dt;});G.parts=G.parts.filter(p=>p.life>0);
  updFx(dt);updTrail(dt);if(G.flash>0)G.flash-=dt*1000;if(G.parryMsg>0)G.parryMsg-=dt*1000;
}
function updP(dt){
  const p=G.player;if(!p||p.state==='dead')return;
  if(p.state!=='blocking')p.st=Math.min(p.maxSt,p.st+p.stReg*dt);p.mp=Math.min(p.maxMp,p.mp+p.mpReg*dt);
  if(p.cid==='mage'&&p.skillLocked&&p.mp>=p.maxMp*0.30)p.skillLocked=false;
  if(p.cid==='mage'&&p.skillLocked&&p.skillActive)p.skillActive=false;
  if(p.inv){p.invTm-=dt*1000;if(p.invTm<=0)p.inv=false;}
  if(p.stTm>0){p.stTm-=dt*1000;if(p.stTm<=0&&['attacking','hurt','dodging'].includes(p.state))p.state='idle';}
  if(p.atkTm>0)p.atkTm-=dt*1000;if(p.parTm>0){p.parTm-=dt*1000;if(p.parTm<=0)p.parAct=false;}
  if(p.parCd>0)p.parCd=Math.max(0,p.parCd-dt*1000);if(p.parKeyCd>0)p.parKeyCd=Math.max(0,p.parKeyCd-dt*1000);
  if(p.skillComboTm>0){p.skillComboTm-=dt*1000;if(p.skillComboTm<=0&&p.skillCombo>0)doAssassinComboHit(p);}
  if(p.state==='dodging'){p.x+=p.dvx*dt;p.y+=p.dvy*dt;clampP(p);return;}
  if(p.state!=='attacking'&&p.state!=='hurt'){let mx=0,my=0;if(K.KeyA||K.ArrowLeft)mx--;if(K.KeyD||K.ArrowRight)mx++;if(K.KeyW||K.ArrowUp)my--;if(K.KeyS||K.ArrowDown)my++;if(mx||my){const l=Math.sqrt(mx*mx+my*my);mx/=l;my/=l;p.face={x:mx,y:my};const sp=p.spd*(p.state==='blocking'?.4:1);p.x+=mx*sp;p.y+=my*sp;clampP(p);}}
  if(K.KeyX||K.KeyF){if(p.state==='attacking'){p.state='blocking';p.atkTm=0;p.stTm=0;}if(p.state==='idle'||p.state==='blocking'){if((JP.KeyX||JP.KeyF)&&p.parCd<=0&&p.parKeyCd<=0){p.parAct=true;p.parTm=p.parW;p.parKeyCd=PAR_TOUCH_DELAY;dust(p.x,p.y,'#ffff88',3);}p.state='blocking';p.st=Math.max(0,p.st-8*dt);if(p.st<=0)p.state='idle';}}
  else if(p.state==='blocking'){p.state='idle';p.parAct=false;}
  if(JP.Space&&p.st>=p.pCost&&p.state==='idle'){let dx=p.face.x,dy=p.face.y;if(K.KeyA||K.ArrowLeft)dx=-1;else if(K.KeyD||K.ArrowRight)dx=1;if(K.KeyW||K.ArrowUp)dy=-1;else if(K.KeyS||K.ArrowDown)dy=1;const l=Math.sqrt(dx*dx+dy*dy)||1;p.dvx=dx/l*265;p.dvy=dy/l*265;p.state='dodging';p.stTm=280;p.inv=true;p.invTm=260;p.st-=p.pCost;dust(p.x,p.y,'#8888ff',5);}
  if(JP.ShiftLeft&&p.state==='idle'){if(p.cid==='warrior'||p.cid==='assassin')doPlayerSkill(p);}
  if((JP.KeyZ||JP.KeyJ)&&p.state==='idle'&&p.atkTm<=0&&!K.KeyX&&!K.KeyF){p.state='attacking';p.stTm=p.atkCd*.5;p.atkTm=p.atkCd;doPlayerAttack(p);}
  if(p.cid==='mage'){if(K.ShiftLeft&&!p.skillLocked){p.skillActive=true;updMageLaser(p,dt);}else if(K.ShiftLeft&&p.skillLocked){p.skillActive=false;}else if(!TC.skl.id){p.skillActive=false;}else if(p.skillActive&&!p.skillLocked){updMageLaser(p,dt);}else if(p.skillLocked){p.skillActive=false;}}
}
function updEs(dt){G.enemies.forEach(e=>{if(e.state!=='dead')updE(e,dt);});}
function updE(e,dt){

function goScr(s){
  G.scr=s;
  if(s==='upgrade')genCards();
  G.parryTxt='';
  if(s==='title')setBgm('title');
  else if(s==='charSelect'||s==='stageMap')setBgm('combat');
  else if(s==='defeat'||s==='victory')setBgm(null);
  // upgrade, combat, boss: setBgm 호출 없음 → 현재 트랙 유지
}

function startCombat(){
  const p=G.player;
  p.st=p.maxSt;p.x=AR.x+AR.w/2;p.y=AR.y+AR.h*.72;p.state='idle';p.inv=false;p.parCd=0;

    G.scr='boss';G.boss=mkBoss();

    G.scr='combat';G.enemies=[];

      const a=Math.random()*Math.PI*2,r=60+Math.random()*50;

function genCards(){
  const p=G.player;const specific=UPGRADES.filter(u=>u.cid&&u.cid===p?.cid);const generic=UPGRADES.filter(u=>!u.cid);const picked=[];
  if(specific.length>0){const si=Math.floor(Math.random()*specific.length);picked.push(specific[si]);}
  const gPool=generic.filter(u=>!picked.includes(u));while(picked.length<3&&gPool.length>0){const gi=Math.floor(Math.random()*gPool.length);picked.push(gPool.splice(gi,1)[0]);}

}

  if(parLocked){const tdProg=TC.par.touchCd/PAR_TOUCH_DELAY;cx.strokeStyle='rgba(255,140,40,0.85)';cx.lineWidth=3;cx.lineCap='round';cx.beginPath();cx.arc(GB.btns.par.x,GB.btns.par.y,GB.btns.par.r+4,-Math.PI/2,-Math.PI/2+tdProg*Math.PI*2);cx.stroke();}
  else if(parOnCd){const cdProg=p.parCd/300;cx.strokeStyle='rgba(255,120,40,0.8)';cx.lineWidth=3;cx.lineCap='round';cx.beginPath();cx.arc(GB.btns.par.x,GB.btns.par.y,GB.btns.par.r+4,-Math.PI/2,-Math.PI/2+cdProg*Math.PI*2);cx.stroke();}
  const parLabel=parLocked?'대기':parOnCd?'쿨':pB?'방어':pP?'패링!':'패링';cx.fillStyle=pP?'#ffff44':TC.par.on?'#fff':'rgba(150,180,255,0.85)';cx.font='bold 11px Courier New';cx.textAlign='center';cx.fillText(parLabel,GB.btns.par.x,GB.btns.par.y+4);
  cx.textAlign='left';
}
cv.addEventListener('touchstart',e=>{
  e.preventDefault();const inCombat=G.scr==='combat'||G.scr==='boss';
  Array.from(e.changedTouches).forEach(t=>{
    const tp=tPos(t);
    if(inCombat){
      const ba=GB.btns.atk;if(Math.hypot(tp.x-ba.x,tp.y-ba.y)<ba.r+12&&TC.atk.id===null){TC.atk.id=t.identifier;TC.atk.fired=false;return;}
      const bp=GB.btns.par;if(Math.hypot(tp.x-bp.x,tp.y-bp.y)<bp.r+12){if(TC.par.touchCd>0)return;TC.par.id=t.identifier;TC.par.on=true;TC.par.tm=0;TC.par.isBlock=false;TC.par.parFired=false;return;}
      const bd=GB.btns.dod;if(Math.hypot(tp.x-bd.x,tp.y-bd.y)<bd.r+12&&TC.dod.id===null){TC.dod.id=t.identifier;TC.dod.fired=false;return;}
      const bs=GB.btns.skl;if(Math.hypot(tp.x-bs.x,tp.y-bs.y)<bs.r+12&&TC.skl.id===null){TC.skl.id=t.identifier;TC.skl.fired=false;return;}
      if(tp.x<W*0.5&&TC.joy.id===null){TC.joy.id=t.identifier;TC.joy.on=true;TC.joy.ox=tp.x;TC.joy.oy=tp.y;TC.joy.dx=0;TC.joy.dy=0;return;}
    }
    M.x=tp.x;M.y=tp.y;M.ck=true;
  });
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t=>{
    if(t.identifier===TC.joy.id){const tp=tPos(t),rx=tp.x-TC.joy.ox,ry=tp.y-TC.joy.oy,dist=Math.hypot(rx,ry),maxR=JOY.outerR;TC.joy.dx=rx/Math.max(dist,1)*Math.min(1,dist/maxR);TC.joy.dy=ry/Math.max(dist,1)*Math.min(1,dist/maxR);}
    if(G.scr!=='combat'&&G.scr!=='boss'){const tp=tPos(t);M.x=tp.x;M.y=tp.y;}
  });
},{passive:false});
function endT(t){
  if(t.identifier===TC.joy.id){TC.joy.id=null;TC.joy.on=false;TC.joy.dx=0;TC.joy.dy=0;}
  if(t.identifier===TC.atk.id){TC.atk.id=null;}
  if(t.identifier===TC.par.id){TC.par.touchCd=TC.par.isBlock?180:PAR_TOUCH_DELAY;TC.par.on=false;TC.par.id=null;}
  if(t.identifier===TC.dod.id){TC.dod.id=null;}
  if(t.identifier===TC.skl.id){TC.skl.id=null;}
}
cv.addEventListener('touchend',e=>{e.preventDefault();Array.from(e.changedTouches).forEach(endT);},{passive:false});
cv.addEventListener('touchcancel',e=>{e.preventDefault();Array.from(e.changedTouches).forEach(endT);},{passive:false});
function applyMobile(dt){
  const inCombat=G.scr==='combat'||G.scr==='boss';if(!inCombat)return;const p=G.player;if(!p||p.state==='dead')return;
  if(TC.par.touchCd>0)TC.par.touchCd=Math.max(0,TC.par.touchCd-dt*1000);
  if(TC.joy.on&&(Math.abs(TC.joy.dx)>0.08||Math.abs(TC.joy.dy)>0.08)){if(p.state!=='attacking'&&p.state!=='hurt'&&p.state!=='dodging'){const sp=p.spd*(p.state==='blocking'?.4:1);p.x+=TC.joy.dx*sp;p.y+=TC.joy.dy*sp;p.face={x:TC.joy.dx,y:TC.joy.dy};clampP(p);}}
  if(TC.atk.id!==null&&!TC.atk.fired){TC.atk.fired=true;if(p.state==='idle'&&p.atkTm<=0){const tgts=(G.scr==='boss'?[G.boss]:G.enemies).filter(e=>e&&e.state!=='dead');if(tgts.length){let near=tgts[0],nd=Infinity;tgts.forEach(e=>{const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<nd){nd=d;near=e;}});const dx=near.x-p.x,dy=near.y-p.y,dist=Math.hypot(dx,dy)||1;p.face={x:dx/dist,y:dy/dist};}p.state='attacking';p.stTm=p.atkCd*.5;p.atkTm=p.atkCd;doPlayerAttack(p);}}
  if(TC.par.on){TC.par.tm+=dt*1000;if(TC.par.tm>=220){TC.par.isBlock=true;if(p.state==='idle'||p.state==='blocking'){p.state='blocking';p.st=Math.max(0,p.st-8*dt);if(p.st<=0){p.state='idle';p.parAct=false;}}}else if(!TC.par.parFired){TC.par.parFired=true;if(p.state==='idle'&&p.parCd<=0){p.parAct=true;p.parTm=p.parW;dust(p.x,p.y,'#ffff88',3);}}}else{if(TC.par.isBlock&&p.state==='blocking'){p.state='idle';p.parAct=false;}TC.par.isBlock=false;}
  if(TC.dod.id!==null&&!TC.dod.fired){TC.dod.fired=true;if(p.st>=p.pCost&&p.state==='idle'){const dx=TC.joy.on?TC.joy.dx:p.face.x,dy=TC.joy.on?TC.joy.dy:p.face.y;const l=Math.hypot(dx,dy)||1;p.dvx=dx/l*265;p.dvy=dy/l*265;p.state='dodging';p.stTm=280;p.inv=true;p.invTm=260;p.st-=p.pCost;dust(p.x,p.y,'#8888ff',5);}}
  if(p.cid==='mage'){if(TC.skl.id!==null){if(!p.skillLocked){p.skillActive=true;if(!TC.skl.fired)TC.skl.fired=true;}else p.skillActive=false;}}
  else{if(TC.skl.id!==null&&!TC.skl.fired){TC.skl.fired=true;if(p.state==='idle'||p.state==='attacking')doPlayerSkill(p);}}
}

function loop(ts){G.dt=Math.min((ts-G.lt)/1000,.05);G.lt=ts;G.t=ts;applyMobile(G.dt);update();render();for(const k in JP)delete JP[k];M.ck=false;requestAnimationFrame(loop);}

initG();
_loadBgm();
setBgm('title');
initSprites().then(()=>requestAnimationFrame(loop));
</script>
</body></html>
