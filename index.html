<script>
// ═══════════════════════════════════════
// BGM 시스템
// music/title.mp3 / music/combat.mp3 / music/boss.mp3
// ═══════════════════════════════════════
const BGM={title:null,combat:null,boss:null};
let _bgmKey=null,_bgmMuted=false;
const _bgmVol=0.35;

function _loadBgm(){
  ['title','combat','boss'].forEach(k=>{
    const a=new Audio();a.loop=true;a.volume=_bgmVol;
    a.src='music/'+k+'.mp3';
    a.addEventListener('error',()=>{BGM[k]=null;},{once:true});
    BGM[k]=a;
  });
}
function setBgm(key){
  if(_bgmKey===key)return;
  if(_bgmKey&&BGM[_bgmKey]){BGM[_bgmKey].pause();BGM[_bgmKey].currentTime=0;}
  _bgmKey=key;
  if(!key)return;
  const t=BGM[key];if(!t)return;
  t.volume=_bgmMuted?0:_bgmVol;t.currentTime=0;
  const p=t.play();if(p)p.catch(()=>{});
}
function toggleBgmMute(){
  _bgmMuted=!_bgmMuted;
  Object.values(BGM).forEach(a=>{if(a)a.volume=_bgmMuted?0:_bgmVol;});
}

// ═══════════════════════════════════════
// 캔버스 & 입력
// ═══════════════════════════════════════
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const W=450,H=800,UI_Y=575;
cv.width=W;cv.height=H;

function resizeCanvas(){
  const sc=Math.min(window.innerWidth/W,window.innerHeight/H);
  cv.style.width=Math.floor(W*sc)+'px';cv.style.height=Math.floor(H*sc)+'px';
}
resizeCanvas();window.addEventListener('resize',resizeCanvas);
cv.focus();cx.imageSmoothingEnabled=false;

const AR={x:20,y:55,w:410,h:480};
const K={},JP={},M={x:0,y:0,ck:false};
cv.addEventListener('keydown',e=>{if(!K[e.code])JP[e.code]=1;K[e.code]=1;e.preventDefault();});
cv.addEventListener('keyup',e=>{delete K[e.code];});
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();M.x=(e.clientX-r.left)*(W/r.width);M.y=(e.clientY-r.top)*(H/r.height);});
cv.addEventListener('mousedown',e=>{const r=cv.getBoundingClientRect();M.x=(e.clientX-r.left)*(W/r.width);M.y=(e.clientY-r.top)*(H/r.height);M.ck=true;});
function tPos(t){const r=cv.getBoundingClientRect();return{x:(t.clientX-r.left)*(W/r.width),y:(t.clientY-r.top)*(H/r.height)};}

// ═══════════════════════════════════════
// 유틸
// ═══════════════════════════════════════
const f=(t,x,y,c='#ccc',s=12,a='left')=>{cx.fillStyle=c;cx.font=`${s}px Courier New`;cx.textAlign=a;cx.fillText(t,x,y);};
const bx=(x,y,w,h,fc,sc,lw=1)=>{if(fc){cx.fillStyle=fc;cx.fillRect(x,y,w,h);}if(sc){cx.strokeStyle=sc;cx.lineWidth=lw;cx.strokeRect(x,y,w,h);}};
const inR=(x,y,w,h)=>M.x>=x&&M.x<=x+w&&M.y>=y&&M.y<=y+h;
const ckR=(x,y,w,h)=>M.ck&&inR(x,y,w,h);
function bar(x,y,w,h,r,fg,bg){cx.fillStyle=bg;cx.fillRect(x,y,w,h);cx.fillStyle=fg;cx.fillRect(x,y,Math.max(0,Math.min(1,r))*w,h);cx.strokeStyle='#333';cx.lineWidth=1;cx.strokeRect(x,y,w,h);}
function btn(x,y,w,h,lb,fc='#aaf',hc='#aaaaff',bc='#448'){
  const hv=inR(x,y,w,h);bx(x,y,w,h,hv?'#1c1c55':'#10102c',hv?hc:bc,hv?2:1);
  f(lb,x+w/2,y+h/2+5,hv?hc:fc,13,'center');return ckR(x,y,w,h);
}
function hexRgba(hex,a){const h=hex.replace('#','');return`rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;}
function lerpColor(a,b,t){
  const ah=a.replace('#',''),bh=b.replace('#','');
  const ar=parseInt(ah.slice(0,2),16),ag=parseInt(ah.slice(2,4),16),ab=parseInt(ah.slice(4,6),16);
  const br=parseInt(bh.slice(0,2),16),bg=parseInt(bh.slice(2,4),16),bb=parseInt(bh.slice(4,6),16);
  return`#${Math.round(ar+(br-ar)*t).toString(16).padStart(2,'0')}${Math.round(ag+(bg-ag)*t).toString(16).padStart(2,'0')}${Math.round(ab+(bb-ab)*t).toString(16).padStart(2,'0')}`;
}

const CHARS=[

  {id:'mage',name:'메이지',sym:'◈',desc:['원거리 마법사','거리를 유지하며','마법을 구사한다','[Shift홀드] 레이저'],col:'#aa55ee',hi:'#cc88ff',atkMode:'ranged',base:{maxHp:60,atk:14,def:14,atkCd:900,maxSt:80,stReg:15,maxMp:120,mpReg:12,spd:2.4,rng:165,pSpd:5,pCost:30,parW:150},stars:{HP:2,공격:3,방어:2,속도:2,스태미너:3,마력:5}},

function isMelee(p){const c=CHARS.find(x=>x.id===p.cid);return c?c.atkMode==='melee':true;}

// ═══════════════════════════════════════

const SPR_CFG={
  warrior:{src:'sprites/warrior.png',sheet:{cols:4,rows:5,cropX:2,cropY:78},anims:{idle:{frames:2,fps:3,loop:true,indices:[0,1]},attack:{frames:6,fps:10,loop:false,indices:[4,5,6,7,8,9]},block:{frames:1,fps:1,loop:true,indices:[10]},hurt:{frames:2,fps:8,loop:false,indices:[18,19]},dodge:{frames:2,fps:10,loop:false,indices:[14,15]}},targetH:40},
  mage:{src:'sprites/mage.png',sheet:{cols:4,rows:4,cropX:0,cropY:0},chromaKey:'#f2f2f2',chromaTol:20,anims:{idle:{frames:2,fps:3,loop:true,indices:[0,3]},attack:{frames:5,fps:11,loop:false,indices:[1,2,3,4,5]},block:{frames:1,fps:1,loop:true,indices:[8]},hurt:{frames:2,fps:8,loop:false,indices:[14,15]},dodge:{frames:2,fps:10,loop:false,indices:[9,10]}},targetH:40},
  assassin:{src:'sprites/assassin.png',sheet:{cols:3,rows:4,cropX:0,cropY:0},anims:{idle:{frames:2,fps:4,loop:true,indices:[0,3]},attack:{frames:5,fps:16,loop:false,indices:[1,2,4,5,7]},block:{frames:1,fps:1,loop:true,indices:[4]},hurt:{frames:2,fps:10,loop:false,indices:[10,11]},dodge:{frames:2,fps:14,loop:false,indices:[8,9]}},targetH:40}
};
const SPR={};let SPR_READY=false;
const ENEMY_SPR_CFG={small:{src:'sprites/enemy_small.png',targetH:28,cols:4,rows:5},large:{src:'sprites/enemy_large.png',targetH:36,cols:3,rows:4},boss:{src:'sprites/enemy_boss.png',targetH:64,cols:3,rows:4}};
const ENEMY_SPR={};let ENEMY_SPR_READY=false;

// 배경 이미지 (추후 ng별 이미지 추가 가능)
const BG_IMG={forest:null,fire:null,abyss:null};
function loadBgImages(){
  const load=(k,src)=>new Promise(r=>{const i=new Image();i.onload=()=>{BG_IMG[k]=i;r();};i.onerror=()=>r();i.src=src;});
  return Promise.all([load('forest','sprites/bg_forest.png'),load('fire','sprites/bg_fire.png'),load('abyss','sprites/bg_abyss.png')]);
}
// 추후 회차별 배경 교체: getBgKey() 수정
function getBgKey(){return G.stage<=3?'forest':G.stage<=6?'fire':'abyss';}
function getBgImg(){return BG_IMG[getBgKey()];}
// 추후 회차별 BGM 교체: getCombatBgm()/getBossBgm() 수정
function getCombatBgm(){return 'combat';}
function getBossBgm(){return 'boss';}

function loadEnemySprite(id,cfg){
  return new Promise(r=>{if(!cfg.src){ENEMY_SPR[id]=null;r();return;}const i=new Image();i.onload=()=>{ENEMY_SPR[id]={img:i,w:i.width/cfg.cols,h:i.height/cfg.rows,targetH:cfg.targetH||40};r();};i.onerror=()=>{ENEMY_SPR[id]=null;r();};i.src=cfg.src;});
}
function initEnemySprites(){return Promise.all(Object.keys(ENEMY_SPR_CFG).map(id=>loadEnemySprite(id,ENEMY_SPR_CFG[id]))).then(()=>{ENEMY_SPR_READY=true;});}

function animLen(def){return def.indices?def.indices.length:def.frames;}
function parseRgb(hex){const h=hex.replace('#','');return parseInt(h,16);}
function applyChroma(img,keyHex,tol){
  try{const rgb=parseRgb(keyHex),r0=rgb>>16&255,g0=rgb>>8&255,b0=rgb&255,t=tol??14;
    const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const g=c.getContext('2d');g.drawImage(img,0,0);
    const id=g.getImageData(0,0,c.width,c.height),d=id.data;
    for(let i=0;i<d.length;i+=4){if(Math.abs(d[i]-r0)<=t&&Math.abs(d[i+1]-g0)<=t&&Math.abs(d[i+2]-b0)<=t)d[i+3]=0;}
    g.putImageData(id,0,0);return c;}catch(e){return img;}
}

// 플레이스홀더 드로잉
function _px(g,x,y,c,w=1,h=1){g.fillStyle=c;g.fillRect(x,y,w,h);}
function drawWarriorFrame(g,fi,row,body,hi){const cx=16,cy=26,bob=row===0?Math.sin(fi*Math.PI):0;_px(g,cx-4,cy-10+bob,body,8,10);_px(g,cx-3,cy-18+bob,body,6,6);_px(g,cx-2,cy-20+bob,'#ffccaa',4,3);let sa=-1.1;if(row===1)sa=-1.4+fi/5*2.6;else if(row===2){sa=-.3;_px(g,cx-10,cy-12+bob,'#6688ff',6,12);}g.save();g.translate(cx,cy-8+bob);g.rotate(sa);_px(g,-2,-1,'#8a6a3a',4,3);_px(g,2,-1,'#ddd',14,2);_px(g,15,-2,hi,4,4);g.restore();}
function drawMageFrame(g,fi,row,body,hi){const cx=16,cy=26,bob=row===0?Math.sin(fi*Math.PI):0;_px(g,cx-4,cy-10+bob,'#4a3070',8,10);_px(g,cx-3,cy-18+bob,body,6,6);_px(g,cx-2,cy-20+bob,'#ffccaa',4,3);let staffA=-.5;if(row===1){const t=fi/4;staffA=-1.2+t*1.4;}g.save();g.translate(cx,cy-6+bob);g.rotate(staffA);_px(g,-1,-1,'#5a4030',3,14);_px(g,-2,-14,hi,5,5);g.restore();}
function drawAssassinFrame(g,fi,row,body,hi){const cx=16,cy=26,bob=row===0?Math.sin(fi*Math.PI)*1.2:0;_px(g,cx-3,cy-10+bob,body,6,9);_px(g,cx-2,cy-17+bob,body,4,5);_px(g,cx-1,cy-19+bob,'#ffccaa',3,3);let da=-.8;if(row===1)da=-1.5+fi/4*2.2;g.save();g.translate(cx+4,cy-8+bob);g.rotate(da);_px(g,0,0,'#aaa',10,2);_px(g,8,-1,hi,3,3);g.restore();}
const PLACE_ROW={idle:{row:0,frames:2},attack:{row:1,frames:6},block:{row:2,frames:1},hurt:{row:3,frames:2},dodge:{row:4,frames:2}};
function buildPlaceholder(id,cfg){
  const ch=CHARS.find(c=>c.id===id),body=ch.col,hi=ch.hi,fw=32,fh=32;
  const oc=document.createElement('canvas');oc.width=fw*6;oc.height=fh*5;
  const g=oc.getContext('2d');g.imageSmoothingEnabled=false;
  const drawFn=id==='warrior'?drawWarriorFrame:id==='mage'?drawMageFrame:drawAssassinFrame;
  Object.entries(PLACE_ROW).forEach(([,def])=>{for(let fi=0;fi<def.frames;fi++){g.save();g.translate(fi*fw,def.row*fh);drawFn(g,fi,def.row,body,hi);g.restore();}});
  const anims={};Object.entries(cfg.anims).forEach(([k])=>{anims[k]={...PLACE_ROW[k],fps:8,loop:k==='idle'||k==='block'};});
  return{img:oc,fw,fh,anims,sheetCols:6,cropX:0,cropY:0,targetH:cfg.targetH||40,placeholder:true};
}
function loadSheet(id,cfg){
  return new Promise(resolve=>{
    const fallback=()=>{SPR[id]=buildPlaceholder(id,cfg);resolve();};
    if(!cfg.src){fallback();return;}
    const img=new Image();
    img.onload=()=>{
      let tex=img;if(cfg.chromaKey)tex=applyChroma(img,cfg.chromaKey,cfg.chromaTol);
      const s=cfg.sheet,cols=s?s.cols:4,rows=s?s.rows:4;
      const cropX=s?(s.cropX||0):0,cropY=s?(s.cropY||0):0;
      const fw=s?(s.fw||Math.floor((tex.width-cropX)/cols)):Math.floor(tex.width/cols);
      const fh=s?(s.fh||Math.floor((tex.height-cropY)/rows)):Math.floor(tex.height/rows);
      SPR[id]={img:tex,fw,fh,anims:cfg.anims,cropX,cropY,sheetCols:cols,targetH:cfg.targetH||40,placeholder:false};resolve();
    };
    img.onerror=()=>{fallback();};img.src=cfg.src;
  });
}
function initSprites(){return Promise.all([...Object.keys(SPR_CFG).map(id=>loadSheet(id,SPR_CFG[id])),initEnemySprites(),loadBgImages()]).then(()=>{SPR_READY=true;});}

function playerAnimName(p){
  if(p.state==='dead')return'idle';
  if(p.state==='attacking')return'attack';
  if(p.state==='blocking')return'block';
  if(p.state==='hurt')return'hurt';
  if(p.state==='dodging')return'dodge';
  return'idle';
}
function playerAnimFrame(p){
  const spr=SPR[p.cid];if(!spr)return 0;
  const name=playerAnimName(p),def=spr.anims[name];if(!def)return 0;
  const n=animLen(def);
  if(name==='attack'){const prog=Math.max(0,Math.min(1,1-p.stTm/(p.atkCd*.5)));return Math.min(n-1,Math.floor(prog*n));}
  if(name==='hurt'||name==='dodge'){const prog=Math.max(0,Math.min(1,1-p.stTm/300));return Math.min(n-1,Math.floor(prog*n));}
  if(!p._anim)p._anim={name:'idle',frame:0,t:0};
  if(p._anim.name!==name)p._anim={name,frame:0,t:0};
  if(def.loop!==false){p._anim.t+=G.dt;p._anim.frame=Math.floor(p._anim.t*(def.fps||4))%n;return p._anim.frame;}
  return 0;
}
function drawSpriteChar(x,y,cid,anim,frame,opts={}){
  const spr=SPR[cid];if(!spr)return false;
  const def=spr.anims[anim]||spr.anims.idle;const fi=Math.min(frame,animLen(def)-1);
  let sx,sy;
  if(def.indices){const idx=def.indices[fi],col=idx%spr.sheetCols,row=Math.floor(idx/spr.sheetCols);sx=(spr.cropX||0)+col*spr.fw;sy=(spr.cropY||0)+row*spr.fh;}
  else{sx=fi*spr.fw+(spr.cropX||0);sy=(def.row||0)*spr.fh+(spr.cropY||0);}
  const th=opts.targetH||spr.targetH||40,scale=th/spr.fh,flip=opts.flipX?-1:1;
  const w=spr.fw*scale,h=spr.fh*scale;
  cx.save();if(opts.alpha!=null)cx.globalAlpha=opts.alpha;cx.translate(x,y);if(flip<0)cx.scale(-1,1);cx.drawImage(spr.img,sx,sy,spr.fw,spr.fh,-w/2,-h+6,w,h);cx.restore();return true;
}
function playerGfxRadius(p){const s=SPR[p.cid];if(s&&s.targetH)return Math.max(16,s.targetH*.4);return 14;}

// ═══════════════════════════════════════
// 업그레이드 풀

const UPGRADES=[

// ═══════════════════════════════════════
// 게임 상태
// ═══════════════════════════════════════
let G={};
function initG(){
  G={scr:'title',ci:-1,stage:1,stageCleared:false,upgrades:[],
     player:null,enemies:[],projs:[],parts:[],
     boss:null,cards:[],flash:0,parryMsg:0,parryTxt:'',
     fx:[],trail:[],t:0,dt:0,lt:0,ng:0};
}

function ngMult(){return Math.pow(2,G.ng);}

function mkPlayer(ci){
  const c=CHARS[ci],b={...c.base};
  return{...b,hp:b.maxHp,st:b.maxSt,mp:b.maxMp,
    x:AR.x+AR.w/2,y:AR.y+AR.h*.72,col:c.col,hi:c.hi,cid:c.id,
    state:'idle',stTm:0,atkTm:0,dvx:0,dvy:0,face:{x:0,y:-1},
    inv:false,invTm:0,parAct:false,parTm:0,parBonus:false,
    parCd:0,parKeyCd:0,skillActive:false,skillLocked:false,
    skillCombo:0,skillComboTm:0};
}

// 회차 배율 적용한 적 생성
function mkEnemy(x,y){
  const pw=1+(G.stage-1)*0.12,elite=G.stage>=11,ng=ngMult();
  const T=[
    {type:'grunt',hp:58,atk:32,spd:1.5,sz:13,col:'#cc3333',detR:160,atkR:42,atkCd:1900,wup:720},
    {type:'fast', hp:32,atk:26,spd:2.6,sz:9, col:'#cc7700',detR:200,atkR:34,atkCd:1200,wup:480},
    {type:'tank', hp:105,atk:48,spd:0.9,sz:18,col:'#7733bb',detR:130,atkR:50,atkCd:2300,wup:950}
  ];
  const rnd=Math.random(),t={...T[rnd<.5?0:rnd<.8?1:2]};
  t.maxHp=t.hp*pw*(elite?2:1)*ng;t.hp=t.maxHp;t.atk=t.atk*pw*ng;
  if(elite)t.col=lerpColor(t.col,'#ffcc44',.38);
  if(G.ng>=1)t.col=lerpColor(t.col,'#ff4444',.25);
  return{...t,elite,x,y,state:'patrol',stTm:0,atkTm:0,
    patA:Math.random()*Math.PI*2,patTm:1000,face:{x:1,y:0},fl:0,lunge:{x:0,y:0},lungeT:0};
}
function mkBoss(){
  const bc=getBossCfg(),pw=1+(G.stage-1)*0.12,ng=ngMult();
  return{name:bc.name+(G.ng>=1?' Ω':''),
    col:G.ng>=1?lerpColor(bc.col,'#ff2222',.35):bc.col,
    maxHp:bc.hp*pw*ng,hp:bc.hp*pw*ng,atk:bc.atk*pw*ng,
    x:AR.x+AR.w/2,y:AR.y+90,sz:28,spd:1.1,
    state:'chase',stTm:0,atkTm:0,phase:1,pi:0,
    atkR:70,atkCd:1600,wup:850,face:{x:0,y:1},fl:0,lunge:{x:0,y:0},lungeT:0};
}

// ═══════════════════════════════════════
// 이펙트
// ═══════════════════════════════════════
function dust(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c,life:.5,ml:.5});}}
function addSlash(x,y,dx,dy,rng,col,opts={}){G.fx.push({type:'slash',x,y,dx,dy,rng:Math.max(28,rng),col,t:opts.t||240,mt:opts.t||240,wide:opts.wide||1,enemy:!!opts.enemy});}
function addImpact(x,y,col,r=28){G.fx.push({type:'impact',x,y,col,r,t:280,mt:280});}
function updFx(dt){G.fx.forEach(a=>a.t-=dt*1000);G.fx=G.fx.filter(a=>a.t>0);}
function drawFx(){
  G.fx.forEach(a=>{
    const prog=1-a.t/a.mt,fade=Math.max(0,1-prog*1.6);
    if(a.type==='slash'){
      const ang=Math.atan2(a.dy,a.dx),sw=Math.PI*(a.wide||1)*.72,reach=a.rng*(a.enemy?.65:1),swing=Math.min(1,prog*2.8);
      cx.save();cx.globalAlpha=fade;cx.strokeStyle=a.col;cx.lineWidth=Math.max(1,4.5-prog*3);cx.lineCap='round';
      cx.beginPath();cx.arc(a.x,a.y,reach*.9,ang-sw/2,ang-sw/2+sw*swing);cx.stroke();
      cx.strokeStyle='#fff';cx.globalAlpha=fade*.4;cx.lineWidth=1.5;
      cx.beginPath();cx.arc(a.x,a.y,reach*.75,ang-sw/2+sw*.15,ang-sw/2+sw*swing*.85);cx.stroke();
      cx.restore();
    }else if(a.type==='impact'){
      cx.save();cx.globalAlpha=fade*.7;cx.strokeStyle=a.col;cx.lineWidth=2*(1-prog);
      cx.beginPath();cx.arc(a.x,a.y,a.r*prog,0,Math.PI*2);cx.stroke();cx.restore();
    }
  });
}

// ═══════════════════════════════════════
// 전투 - 플레이어 공격/스킬
// ═══════════════════════════════════════
function doPlayerAttack(p){
  const tgts=G.scr==='boss'?[G.boss]:G.enemies;
  if(isMelee(p)){
    addSlash(p.x,p.y,p.face.x,p.face.y,p.rng,p.hi,{wide:p.rng>80?1.15:1});
    tgts.forEach(e=>{if(!e||e.state==='dead')return;if(Math.hypot(e.x-p.x,e.y-p.y)<=p.rng+(e.sz||12)){const d=p.parBonus?p.atk*2:p.atk;p.parBonus=false;hitE(e,d);}});
  }else{
    const ox=p.x+p.face.x*14,oy=p.y+p.face.y*14;
    dust(ox,oy,p.hi,5);firePrj(ox,oy,p.face.x,p.face.y,p.atk,p.pSpd,p.hi,'player');
  }
}
function doPlayerSkill(p){
  if(p.state==='dead')return;
  if(p.cid==='warrior'){
    const cost=p.maxMp*.3;if(p.mp<cost)return;p.mp-=cost;
    dust(p.x,p.y,'#ffcc44',18);addImpact(p.x,p.y,'#ffcc44',70);
    const tgts=(G.scr==='boss'?[G.boss]:G.enemies).filter(e=>e&&e.state!=='dead');
    tgts.forEach(e=>{const dx=e.x-p.x,dy=e.y-p.y,dist=Math.hypot(dx,dy);
      if(dist<92){const l=dist||1;e.x=Math.max(AR.x+e.sz,Math.min(AR.x+AR.w-e.sz,e.x+dx/l*90));e.y=Math.max(AR.y+e.sz,Math.min(AR.y+AR.h-e.sz,e.y+dy/l*90));e.state='stunned';e.stTm=600;dust(e.x,e.y,'#ff8844',8);}
    });
    G.fx.push({type:'impact',x:p.x,y:p.y,col:'#ffcc44',r:92,t:320,mt:320});
    G.parryMsg=800;G.parryTxt='넉백!';
  }else if(p.cid==='mage'){
    p.skillActive=true;
  }else if(p.cid==='assassin'){
    const cost=p.maxMp*.3;if(p.mp<cost||p.skillCombo>0)return;
    p.mp-=cost;p.skillCombo=3;p.skillComboTm=0;doAssassinHit(p);
  }
}
function doAssassinHit(p){
  if(p.skillCombo<=0||p.state==='dead')return;p.skillCombo--;
  const tgts=(G.scr==='boss'?[G.boss]:G.enemies).filter(e=>e&&e.state!=='dead');
  if(!tgts.length)return;
  let near=tgts[0],nd=Infinity;tgts.forEach(e=>{const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<nd){nd=d;near=e;}});
  const dx=near.x-p.x,dy=near.y-p.y,dist=Math.hypot(dx,dy)||1;
  p.face={x:dx/dist,y:dy/dist};
  addSlash(p.x,p.y,p.face.x,p.face.y,p.rng*1.1,p.hi,{wide:1.15,t:180});
  tgts.forEach(e=>{if(Math.hypot(e.x-p.x,e.y-p.y)<=p.rng+(e.sz||12)+10)hitE(e,p.atk*1.2);});
  dust(p.x,p.y,p.hi,5);
  if(p.skillCombo>0)p.skillComboTm=200;
}
function updMageLaser(p,dt){
  if(!p.skillActive)return;
  const drain=p.maxMp*.4*dt;
  if(p.mp<=drain){p.mp=0;p.skillActive=false;p.skillLocked=true;return;}
  p.mp-=drain;
  if(!p._laserTm)p._laserTm=0;
  p._laserTm-=dt*1000;
  if(p._laserTm<=0){p._laserTm=90;firePrj(p.x+p.face.x*18,p.y+p.face.y*18,p.face.x,p.face.y,p.atk*.24,9,p.hi,'player');dust(p.x+p.face.x*18,p.y+p.face.y*18,p.hi,3);}
  G.fx.push({type:'laser',x:p.x,y:p.y,dx:p.face.x,dy:p.face.y,col:p.hi,t:95,mt:95});
}
function drawLaserFx(){
  G.fx.filter(a=>a.type==='laser').forEach(a=>{
    const prog=1-a.t/a.mt,fade=Math.max(0,1-prog*2),len=AR.w*1.1;
    cx.save();cx.globalAlpha=fade*.85;cx.strokeStyle=a.col;cx.lineWidth=6;cx.lineCap='round';
    cx.shadowColor=a.col;cx.shadowBlur=12;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(a.x+a.dx*len,a.y+a.dy*len);cx.stroke();
    cx.lineWidth=2;cx.strokeStyle='#fff';cx.globalAlpha=fade*.5;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(a.x+a.dx*len,a.y+a.dy*len);cx.stroke();
    cx.shadowBlur=0;cx.restore();
  });
}

// ═══════════════════════════════════════
// 전투 - 피격 & 사망
// ═══════════════════════════════════════
function clampP(p){p.x=Math.max(AR.x+13,Math.min(AR.x+AR.w-13,p.x));p.y=Math.max(AR.y+13,Math.min(AR.y+AR.h-13,p.y));}

function hitE(e,d){
  if(e.state==='dead')return;
  e.hp=Math.max(0,e.hp-d);e.fl=200;
  dust(e.x,e.y,'#ff5555',4);
  if(e.hp<=0){e.hp=0;e.state='dead';dust(e.x,e.y,'#ffaaaa',10);addImpact(e.x,e.y,'#ff8888');}
}

// 플레이어 피격 - 단순·명확하게 작성
function hitP(dmgRaw){
  const p=G.player;
  if(!p)return;
  if(p.state==='dead')return;  // 이미 사망
  if(p.inv)return;              // 무적 중

  // 패링 성공
  if(p.parAct){
    p.parAct=false;p.parTm=0;
    G.flash=80;G.parryMsg=1200;p.parBonus=true;p.parCd=300;
    if(p.cid==='warrior'){p.hp=Math.min(p.maxHp,p.hp+15);G.parryTxt='+15 HP';}
    else if(p.cid==='mage'){p.mp=Math.min(p.maxMp,p.mp+35);G.parryTxt='+35 MP';}
    else if(p.cid==='assassin'){p.hp=Math.min(p.maxHp,p.hp+8);p.mp=Math.min(p.maxMp,p.mp+15);G.parryTxt='+8 HP +15 MP';}
    dust(p.x,p.y,'#ffff44',14);addImpact(p.x,p.y,'#ffff44',40);
    (G.scr==='boss'?[G.boss]:G.enemies).forEach(e=>{if(e&&e.state!=='dead'&&Math.hypot(e.x-p.x,e.y-p.y)<160){e.state='stunned';e.stTm=1500;}});
    return;
  }

  // 데미지 계산
  const blocking=p.state==='blocking';
  const dmg=Math.max(1, blocking ? dmgRaw-p.def*.8 : dmgRaw-p.def*.3);
  p.hp=Math.max(0,p.hp-dmg);

  if(blocking){
    p.st=Math.max(0,p.st-20);
    dust(p.x,p.y,'#4455ff',4);
    if(p.st<=0&&p.state==='blocking')p.state='idle';
  }else{
    G.flash=200;
    dust(p.x,p.y,'#ff2222',8);
    addImpact(p.x,p.y,'#ff2222',35);
    p.state='hurt';
    p.stTm=300;
  }

  // 무적 부여 (방어 중에도)
  p.inv=true;p.invTm=500;

  // 사망 판정
  if(p.hp<=0){
    p.hp=0;
    p.state='dead';
    p.inv=false;
    p.stTm=0;
    setBgm(null);
    setTimeout(()=>goScr('defeat'),1500);
  }
}

function firePrj(x,y,dx,dy,d,sp,c,ow){G.projs.push({x,y,dx,dy,d,sp:sp*200,c,ow,r:6,life:2.5,trail:[]});}

// ═══════════════════════════════════════
// 업데이트
// ═══════════════════════════════════════
function update(){
  const dt=G.dt;
  if(G.scr==='combat'||G.scr==='boss'){
    updP(dt);
    if(G.scr==='combat')updEs(dt);else updB(dt);
    updProjs(dt);
    checkEnd();
  }
  G.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.9;p.vy*=.9;p.life-=dt;});
  G.parts=G.parts.filter(p=>p.life>0);
  updFx(dt);
  G.trail.forEach(t=>t.life-=dt);G.trail=G.trail.filter(t=>t.life>0);
  const pp=G.player;if(pp&&pp.state==='dodging')G.trail.push({x:pp.x,y:pp.y,col:pp.col,life:.18,ml:.18});
  if(G.flash>0)G.flash-=dt*1000;
  if(G.parryMsg>0)G.parryMsg-=dt*1000;
}

function updP(dt){
  const p=G.player;if(!p)return;
  if(p.state==='dead')return;  // 사망 후 모든 업데이트 차단

  // 리소스 회복
  if(p.state!=='blocking')p.st=Math.min(p.maxSt,p.st+p.stReg*dt);
  p.mp=Math.min(p.maxMp,p.mp+p.mpReg*dt);
  if(p.cid==='mage'&&p.skillLocked&&p.mp>=p.maxMp*.3)p.skillLocked=false;
  if(p.cid==='mage'&&p.skillLocked)p.skillActive=false;

  // 타이머
  if(p.inv){p.invTm-=dt*1000;if(p.invTm<=0){p.inv=false;p.invTm=0;}}
  if(p.stTm>0){
    p.stTm-=dt*1000;
    if(p.stTm<=0){
      p.stTm=0;
      // hurt/attacking/dodging → idle 복귀 (dead는 위에서 이미 차단됨)
      if(p.state==='hurt'||p.state==='attacking'||p.state==='dodging')p.state='idle';
    }
  }
  if(p.atkTm>0)p.atkTm-=dt*1000;
  if(p.parTm>0){p.parTm-=dt*1000;if(p.parTm<=0){p.parAct=false;p.parTm=0;}}
  if(p.parCd>0)p.parCd=Math.max(0,p.parCd-dt*1000);
  if(p.parKeyCd>0)p.parKeyCd=Math.max(0,p.parKeyCd-dt*1000);
  if(p.skillComboTm>0){p.skillComboTm-=dt*1000;if(p.skillComboTm<=0&&p.skillCombo>0)doAssassinHit(p);}

  // 회피 이동
  if(p.state==='dodging'){p.x+=p.dvx*dt;p.y+=p.dvy*dt;clampP(p);return;}

  // 키보드 이동
  if(p.state!=='attacking'&&p.state!=='hurt'){
    let mx=0,my=0;
    if(K.KeyA||K.ArrowLeft)mx--;if(K.KeyD||K.ArrowRight)mx++;
    if(K.KeyW||K.ArrowUp)my--;if(K.KeyS||K.ArrowDown)my++;
    if(mx||my){
      const l=Math.sqrt(mx*mx+my*my);mx/=l;my/=l;
      p.face={x:mx,y:my};
      const sp=p.spd*(p.state==='blocking'?.4:1);
      p.x+=mx*sp;p.y+=my*sp;clampP(p);
    }
  }

  // 패링/방어
  if(K.KeyX||K.KeyF){
    if(p.state==='attacking'){p.state='blocking';p.atkTm=0;p.stTm=0;}
    if(p.state==='idle'||p.state==='blocking'){
      if((JP.KeyX||JP.KeyF)&&p.parCd<=0&&p.parKeyCd<=0){
        p.parAct=true;p.parTm=p.parW;p.parKeyCd=PAR_TOUCH_DELAY;
        dust(p.x,p.y,'#ffff88',3);
      }
      p.state='blocking';p.st=Math.max(0,p.st-8*dt);
      if(p.st<=0)p.state='idle';
    }
  }else if(p.state==='blocking'){p.state='idle';p.parAct=false;}

  // 회피
  if(JP.Space&&p.st>=p.pCost&&p.state==='idle'){
    let dx=p.face.x,dy=p.face.y;
    if(K.KeyA||K.ArrowLeft)dx=-1;else if(K.KeyD||K.ArrowRight)dx=1;
    if(K.KeyW||K.ArrowUp)dy=-1;else if(K.KeyS||K.ArrowDown)dy=1;
    const l=Math.sqrt(dx*dx+dy*dy)||1;
    p.dvx=dx/l*265;p.dvy=dy/l*265;
    p.state='dodging';p.stTm=280;p.inv=true;p.invTm=260;p.st-=p.pCost;
    dust(p.x,p.y,'#8888ff',5);
  }

  // 스킬
  if(JP.ShiftLeft&&p.state==='idle'&&(p.cid==='warrior'||p.cid==='assassin'))doPlayerSkill(p);

  // 공격
  if((JP.KeyZ||JP.KeyJ)&&p.state==='idle'&&p.atkTm<=0&&!K.KeyX&&!K.KeyF){
    p.state='attacking';p.stTm=p.atkCd*.5;p.atkTm=p.atkCd;doPlayerAttack(p);
  }

  // 메이지 레이저
  if(p.cid==='mage'){
    if(K.ShiftLeft&&!p.skillLocked){p.skillActive=true;updMageLaser(p,dt);}
    else if(K.ShiftLeft&&p.skillLocked){p.skillActive=false;}
    else if(!TC.skl.id){p.skillActive=false;}
    else if(p.skillActive&&!p.skillLocked){updMageLaser(p,dt);}
    else if(p.skillLocked){p.skillActive=false;}
  }
}

function updEs(dt){G.enemies.forEach(e=>{if(e.state!=='dead')updE(e,dt);});}
function updE(e,dt){
  if(e.fl>0)e.fl-=dt*1000;if(e.atkTm>0)e.atkTm-=dt*1000;if(e.stTm>0)e.stTm-=dt*1000;if(e.lungeT>0)e.lungeT-=dt*1000;
  const p=G.player,dx=p.x-e.x,dy=p.y-e.y,dist=Math.sqrt(dx*dx+dy*dy)||.001;
  if(e.state==='stunned'){if(e.stTm<=0)e.state='chase';return;}
  switch(e.state){
    case'patrol':e.patTm-=dt*1000;if(e.patTm<=0){e.patA+=(Math.random()-.5)*Math.PI;e.patTm=800+Math.random()*800;}
      e.x=Math.max(AR.x+e.sz,Math.min(AR.x+AR.w-e.sz,e.x+Math.cos(e.patA)*e.spd));
      e.y=Math.max(AR.y+e.sz,Math.min(AR.y+AR.h-e.sz,e.y+Math.sin(e.patA)*e.spd));
      if(dist<e.detR)e.state='chase';break;
    case'chase':
      if(dist>e.detR*1.5){e.state='patrol';break;}
      if(dist<=e.atkR&&e.atkTm<=0){e.state='windup';e.stTm=e.wup;e.face={x:dx/dist,y:dy/dist};break;}
      if(dist>1){const minD=e.sz+10,step=Math.min(e.spd,Math.max(0,dist-minD));e.x+=dx/dist*step;e.y+=dy/dist*step;e.face={x:dx/dist,y:dy/dist};}
      e.x=Math.max(AR.x+e.sz,Math.min(AR.x+AR.w-e.sz,e.x));e.y=Math.max(AR.y+e.sz,Math.min(AR.y+AR.h-e.sz,e.y));break;
    case'windup':
      if(e.stTm<=0){e.state='attacking';e.stTm=320;const ld=dist||1;e.lunge={x:dx/ld*24,y:dy/ld*24};e.lungeT=300;
        addSlash(e.x,e.y,e.face.x,e.face.y,e.atkR+18,e.col,{enemy:true,t:200});
        if(dist<e.atkR+22)hitP(e.atk);e.atkTm=e.atkCd;}break;
    case'attacking':if(e.stTm<=0)e.state='chase';break;
  }
}

function updB(dt){
  const b=G.boss;if(!b||b.state==='handled')return;
  if(b.fl>0)b.fl-=dt*1000;if(b.atkTm>0)b.atkTm-=dt*1000;if(b.stTm>0)b.stTm-=dt*1000;if(b.lungeT>0)b.lungeT-=dt*1000;
  if(b.hp<b.maxHp*.4&&b.phase===1){b.phase=2;b.spd*=1.5;b.atkCd=Math.max(700,Math.floor(b.atkCd*.65));dust(b.x,b.y,b.col,25);addImpact(b.x,b.y,b.col,60);}
  const p=G.player,dx=p.x-b.x,dy=p.y-b.y,dist=Math.sqrt(dx*dx+dy*dy)||.001;
  if(b.state==='stunned'){if(b.stTm<=0)b.state='chase';return;}
  switch(b.state){
    case'chase':
      if(dist<=b.atkR&&b.atkTm<=0){b.state='windup';b.stTm=b.wup;b.face={x:dx/dist,y:dy/dist};b.pi=(b.pi+1)%3;}
      else{const minD=b.sz+10,step=Math.min(b.spd,Math.max(0,dist-minD));b.x+=dx/dist*step;b.y+=dy/dist*step;b.face={x:dx/dist,y:dy/dist};
        b.x=Math.max(AR.x+b.sz,Math.min(AR.x+AR.w-b.sz,b.x));b.y=Math.max(AR.y+b.sz,Math.min(AR.y+AR.h-b.sz,b.y));}break;
    case'windup':
      if(b.stTm<=0){b.state='attacking';b.stTm=420;const ddx=p.x-b.x,ddy=p.y-b.y,dd=Math.sqrt(ddx*ddx+ddy*ddy)||1;b.lunge={x:ddx/dd*30,y:ddy/dd*30};b.lungeT=350;
        switch(b.pi%3){
          case 0:addSlash(b.x,b.y,b.face.x,b.face.y,b.atkR+28,b.col,{enemy:true,wide:1.2,t:260});if(dd<b.atkR+35)hitP(b.atk*1.3);addImpact(p.x,p.y,b.col,50);break;
          case 1:for(let i=-1;i<=1;i++){const a=Math.atan2(ddy,ddx)+i*.36;firePrj(b.x,b.y,Math.cos(a),Math.sin(a),b.atk*.75,3,b.col,'enemy');}break;
          case 2:for(let i=0;i<8;i++){const a=i/8*Math.PI*2;firePrj(b.x,b.y,Math.cos(a),Math.sin(a),b.atk*.5,2.5,b.col,'enemy');}addImpact(b.x,b.y,b.col,70);break;
        }b.atkTm=b.atkCd;}break;
    case'attacking':if(b.stTm<=0)b.state='chase';break;
  }
  if(b.hp<=0&&b.state!=='handled'){b.hp=0;b.state='handled';setBgm(null);setTimeout(()=>goScr('victory'),1200);}
}

function updProjs(dt){
  G.projs=G.projs.filter(pr=>pr.life>0);
  G.projs.forEach(pr=>{
    pr.trail=pr.trail||[];pr.trail.push({x:pr.x,y:pr.y});if(pr.trail.length>8)pr.trail.shift();
    pr.x+=pr.dx*pr.sp*dt;pr.y+=pr.dy*pr.sp*dt;pr.life-=dt;
    if(pr.x<AR.x||pr.x>AR.x+AR.w||pr.y<AR.y||pr.y>AR.y+AR.h){pr.life=0;return;}
    const tgts=pr.ow==='player'?(G.scr==='boss'?[G.boss]:G.enemies):[G.player];
    tgts.forEach(t=>{if(!t||t.state==='dead')return;if(Math.hypot(t.x-pr.x,t.y-pr.y)<(t.sz||12)+pr.r){pr.ow==='player'?hitE(t,pr.d):hitP(pr.d);pr.life=0;}});
  });
}

function checkEnd(){
  if(G.scr==='combat'&&!G.stageCleared&&G.enemies.length>0&&G.enemies.every(e=>e.state==='dead')){
    G.stageCleared=true;G.stage++;setTimeout(()=>goScr('upgrade'),500);
  }
}

let _titlePlayed=false;

function goScr(s){
  G.scr=s;
  if(s==='upgrade')genCards();
  G.parryTxt='';
  if(s==='charSelect'||s==='stageMap')setBgm(getCombatBgm());
  else if(s==='defeat'||s==='victory')setBgm(null);
  // title BGM: drawTitle 첫 클릭에서 처리
  // upgrade/combat/boss: 변경 없음
}

function startCombat(){
  const p=G.player;
  p.st=p.maxSt;p.x=AR.x+AR.w/2;p.y=AR.y+AR.h*.72;
  p.state='idle';p.inv=false;p.invTm=0;p.stTm=0;p.atkTm=0;p.parCd=0;p.parKeyCd=0;p.parAct=false;
  p.skillActive=false;p.skillLocked=false;p.skillCombo=0;p.skillComboTm=0;
  G.projs=[];G.parts=[];G.fx=[];G.trail=[];G.stageCleared=false;
  if(G.stage===10){G.scr='boss';G.boss=mkBoss();setBgm(getBossBgm());}
  else{
    G.scr='combat';G.enemies=[];
    setBgm(getCombatBgm());
    for(let i=0;i<G.stage;i++){
      const a=Math.random()*Math.PI*2,r=60+Math.random()*50;
      G.enemies.push(mkEnemy(Math.max(AR.x+25,Math.min(AR.x+AR.w-25,AR.x+AR.w/2+Math.cos(a)*r)),Math.max(AR.y+25,Math.min(AR.y+AR.h*.5,AR.y+80+Math.sin(a)*r*.5))));
    }
  }
}

function genCards(){
  const p=G.player;
  const sp=UPGRADES.filter(u=>u.cid&&u.cid===p?.cid);
  const gn=UPGRADES.filter(u=>!u.cid);
  const picked=[];
  if(sp.length>0)picked.push(sp[Math.floor(Math.random()*sp.length)]);
  const pool=gn.filter(u=>!picked.includes(u));
  while(picked.length<3&&pool.length>0)picked.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  G.cards=picked.slice(0,3);
}

function drawPlayer(p){
  const flip=p.face.x<0;
  let alpha=1;if(p.state==='dead')alpha=.25;else if(p.inv&&Math.floor(G.t/80)%2===0)alpha=.5;
  const gr=playerGfxRadius(p);
  // 후광
  if(p.state!=='dead'){
    const glowCol=p.state==='blocking'?'#4466ff':p.state==='hurt'?'#ff3322':p.parAct?'#ffff44':p.hi;
    const pulse=.06+Math.sin(G.t*.004)*.04,glowR=gr*2.2;
    const grd=cx.createRadialGradient(p.x,p.y-gr*.3,gr*.2,p.x,p.y-gr*.3,glowR);
    grd.addColorStop(0,hexRgba(glowCol,pulse*2.2));grd.addColorStop(.45,hexRgba(glowCol,pulse));grd.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=grd;cx.beginPath();cx.ellipse(p.x,p.y-gr*.3,glowR,glowR*.85,0,0,Math.PI*2);cx.fill();
  }
  // 그림자
  cx.fillStyle='rgba(0,0,0,.35)';cx.beginPath();cx.ellipse(p.x,p.y+6,gr*1.05,gr*.38,0,0,Math.PI*2);cx.fill();
  // 스프라이트
  if(SPR_READY&&SPR[p.cid]){drawSpriteChar(p.x,p.y,p.cid,playerAnimName(p),playerAnimFrame(p),{flipX:flip,alpha});}
  else{const sz=12;cx.globalAlpha=alpha;cx.fillStyle=p.state==='blocking'?'#4455cc':p.col;cx.fillRect(p.x-sz,p.y-sz,sz*2,sz*2);cx.globalAlpha=1;}
  // 공격 이펙트
  if(p.state==='attacking'){
    const prog=Math.max(0,1-p.stTm/(p.atkCd*.5)),ang=Math.atan2(p.face.y,p.face.x),sw=Math.PI*.7,reach=isMelee(p)?p.rng*.85:28;
    cx.save();cx.globalAlpha=alpha*.9;cx.strokeStyle=p.hi;cx.lineWidth=3;cx.lineCap='round';
    cx.beginPath();cx.arc(p.x,p.y,reach,ang-sw/2,ang-sw/2+sw*Math.min(1,prog*2.2));cx.stroke();cx.restore();
  }
  if(p.parAct){const half=Math.max(26,playerGfxRadius(p)*1.15);cx.strokeStyle='#ffff44';cx.lineWidth=2.5;cx.strokeRect(p.x-half,p.y-half,half*2,half*2);}
}

function drawParryUI(p){
  if(!p||p.state==='dead')return;
  const rad=playerGfxRadius(p)+10;
  if(p.parAct&&p.parTm>0){
    const r=p.parTm/p.parW;cx.save();cx.strokeStyle='#ffff44';cx.lineWidth=3;cx.lineCap='round';
    cx.beginPath();cx.arc(p.x,p.y,rad,-Math.PI/2,-Math.PI/2+Math.PI*2*r);cx.stroke();
    cx.fillStyle='#ffff44';cx.font='bold 10px Courier New';cx.textAlign='center';cx.fillText('패링',p.x,p.y-rad-8);cx.restore();
  }
  const ents=G.scr==='boss'?(G.boss?[G.boss]:[]):G.enemies;
  ents.forEach(e=>{
    if(!e||e.state!=='windup')return;
    if(Math.hypot(p.x-e.x,p.y-e.y)>(e.atkR||50)+45)return;
    if(e.stTm<=Math.max(160,p.parW*.9)){
      cx.save();cx.strokeStyle='rgba(255,255,80,.85)';cx.lineWidth=2;cx.setLineDash([4,3]);
      cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(e.x,e.y);cx.stroke();
      cx.fillStyle='#ffff88';cx.font='bold 12px Courier New';cx.textAlign='center';
      cx.fillText(p.parCd>0?'쿨다운':'패링!',e.x,e.y-e.sz-24);
      cx.restore();cx.setLineDash([]);

}

function drawWindupGauge(ex,ey,sz,stTm,wup,parW,isEnemy){
  const prog=1-stTm/wup,parryZone=stTm<=Math.max(170,(parW||150)*.92);
  const rad=sz+(isEnemy?20:26),fgLw=isEnemy?(parryZone?8:6):(parryZone?11:9);
  cx.save();cx.strokeStyle='rgba(200,50,0,.22)';cx.lineWidth=isEnemy?5:7;cx.beginPath();cx.arc(ex,ey,rad,0,Math.PI*2);cx.stroke();
  cx.strokeStyle=parryZone?'#ffee11':`rgb(255,${Math.floor(100*(1-prog))},0)`;
  cx.lineWidth=fgLw;cx.lineCap='round';cx.beginPath();cx.arc(ex,ey,rad,-Math.PI/2,-Math.PI/2+prog*Math.PI*2);cx.stroke();
  if(parryZone){
    const pulse=.45+Math.sin(G.t*.03)*.55;
    cx.strokeStyle=`rgba(255,255,50,${pulse*.75})`;cx.lineWidth=fgLw*2;cx.globalAlpha=pulse*.4;cx.beginPath();cx.arc(ex,ey,rad,0,Math.PI*2);cx.stroke();
    cx.globalAlpha=1;cx.fillStyle='#ffff33';cx.font=`bold ${isEnemy?10:13}px Courier New`;cx.textAlign='center';cx.fillText('패링!',ex,ey-rad-(isEnemy?9:13));
  }
  cx.restore();
}

function drawEnemy(e){
  const sz=e.sz,lf=Math.max(0,e.lungeT/300),ex=e.x+e.lunge.x*lf,ey=e.y+e.lunge.y*lf;
  const flashing=e.fl>0&&Math.floor(e.fl/50)%2===0;
  if(e.state==='windup')drawWindupGauge(ex,ey,sz,e.stTm,e.wup,G.player?.parW,true);
  // 엘리트 글로우
  if(e.elite&&!flashing){cx.save();cx.strokeStyle='rgba(255,200,50,.5)';cx.lineWidth=3;cx.beginPath();cx.arc(ex,ey,sz+5,0,Math.PI*2);cx.stroke();cx.globalAlpha=.1;cx.fillStyle='#ffcc44';cx.beginPath();cx.arc(ex,ey,sz+5,0,Math.PI*2);cx.fill();cx.restore();}
  // 기절 별
  if(e.state==='stunned'){for(let i=0;i<3;i++){const sa=G.t*.003+i*Math.PI*2/3;cx.fillStyle='#ffff00';cx.fillRect(ex+Math.cos(sa)*(sz+6)-3,ey+Math.sin(sa)*(sz+6)-3,5,5);}}
  // 스프라이트 or 폴백
  const spr=ENEMY_SPR_READY?ENEMY_SPR[e.type==='fast'?'small':'large']:null;
  if(spr&&spr.img){
    const sc=spr.targetH/spr.h,w=spr.w*sc,h=spr.h*sc;
    cx.save();if(flashing)cx.globalAlpha=.5;else if(e.state==='stunned')cx.globalAlpha=.6;
    cx.translate(ex,ey);cx.scale(e.face.x<0?-1:1,1);cx.drawImage(spr.img,0,0,spr.w,spr.h,-w/2,-h/2,w,h);cx.restore();
  }else{
    cx.fillStyle=flashing?'#fff':e.state==='stunned'?'#777':e.col;
    cx.save();cx.translate(ex,ey);
    if(e.type==='fast'){cx.beginPath();cx.moveTo(0,-sz);cx.lineTo(sz,0);cx.lineTo(0,sz);cx.lineTo(-sz,0);cx.closePath();cx.fill();}
    else if(e.type==='tank'){cx.fillRect(-sz,-sz,sz*2,sz*2);}
    else{cx.fillRect(-sz,-sz,sz*2,sz*2);}
    cx.restore();
  }
  // 공격 이펙트
  if(e.state==='attacking'){
    cx.save();cx.translate(ex,ey);const prog=Math.max(0,e.stTm/320),ang=Math.atan2(e.face.y,e.face.x);
    cx.strokeStyle=e.col;cx.lineWidth=2.5;cx.lineCap='round';
    cx.beginPath();cx.arc(0,0,e.atkR*.7,ang-Math.PI*.6/2,ang-Math.PI*.6/2+Math.PI*.6*(1-prog));cx.stroke();cx.restore();
  }
  // 체력바 - 항상 표시
  const hr=Math.max(0,e.hp/e.maxHp);
  cx.fillStyle='#111';cx.fillRect(ex-sz,ey-sz-10,sz*2,6);
  cx.fillStyle=hr>.5?'#44ff44':hr>.25?'#ffaa00':'#ff4444';
  cx.fillRect(ex-sz,ey-sz-10,sz*2*hr,6);
  cx.strokeStyle='#333';cx.lineWidth=1;cx.strokeRect(ex-sz,ey-sz-10,sz*2,6);
}

function drawBoss(b){
  const sz=b.sz,lf=Math.max(0,b.lungeT/350),bx2=b.x+b.lunge.x*lf,by2=b.y+b.lunge.y*lf;
  if(b.state==='windup')drawWindupGauge(bx2,by2,sz,b.stTm,b.wup,G.player?.parW,false);
  if(b.state==='stunned'){for(let i=0;i<4;i++){const sa=G.t*.003+i*Math.PI/2;cx.fillStyle='#ffff00';cx.fillRect(bx2+Math.cos(sa)*(sz+8)-3,by2+Math.sin(sa)*(sz+8)-3,6,6);}}
  const fl=b.fl>0&&Math.floor(b.fl/50)%2===0;
  const spr=ENEMY_SPR_READY?ENEMY_SPR['boss']:null;
  if(spr&&spr.img){const sc=spr.targetH/spr.h,w=spr.w*sc,h=spr.h*sc;cx.save();if(fl)cx.globalAlpha=.5;cx.translate(bx2,by2);cx.scale(b.face.x<0?-1:1,1);cx.drawImage(spr.img,0,0,spr.w,spr.h,-w/2,-h/2,w,h);if(b.phase===2){cx.globalAlpha=.2+Math.sin(G.t*.01)*.1;cx.fillStyle='#ff4400';cx.beginPath();cx.arc(0,0,w*.5,0,Math.PI*2);cx.fill();}cx.restore();}
  else{cx.fillStyle=fl?'#fff':b.col;cx.save();cx.translate(bx2,by2);cx.fillRect(-sz,-sz,sz*2,sz*2);cx.restore();}
  // 보스 HP 바

}

function _gbBtn(b,active,col,hi){

  cx.strokeStyle=active?hi:'rgba(255,255,255,.15)';cx.lineWidth=active?2:1;cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.stroke();
  const hl=cx.createRadialGradient(b.x,b.y-b.r*.35,b.r*.05,b.x,b.y-b.r*.2,b.r*.8);hl.addColorStop(0,'rgba(255,255,255,.18)');hl.addColorStop(1,'rgba(255,255,255,0)');
  cx.fillStyle=hl;cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.fill();

  else if(parOnCd){const cdP=p.parCd/300;cx.strokeStyle='rgba(255,120,40,.8)';cx.lineWidth=3;cx.lineCap='round';cx.beginPath();cx.arc(GB.btns.par.x,GB.btns.par.y,GB.btns.par.r+4,-Math.PI/2,-Math.PI/2+cdP*Math.PI*2);cx.stroke();}
  const parLabel=parLocked?'대기':parOnCd?'쿨':pB?'방어':pP?'패링!':'패링';
  cx.fillStyle=pP?'#ffff44':TC.par.on?'#fff':'rgba(150,180,255,.85)';cx.font='bold 11px Courier New';cx.textAlign='center';cx.fillText(parLabel,GB.btns.par.x,GB.btns.par.y+4);
  cx.textAlign='left';
}

cv.addEventListener('touchstart',e=>{
  e.preventDefault();const inC=G.scr==='combat'||G.scr==='boss';
  Array.from(e.changedTouches).forEach(t=>{
    const tp=tPos(t);
    if(inC){
      const ba=GB.btns.atk;if(Math.hypot(tp.x-ba.x,tp.y-ba.y)<ba.r+12&&TC.atk.id===null){TC.atk.id=t.identifier;TC.atk.fired=false;return;}
      const bp=GB.btns.par;if(Math.hypot(tp.x-bp.x,tp.y-bp.y)<bp.r+12){if(TC.par.touchCd>0)return;TC.par.id=t.identifier;TC.par.on=true;TC.par.tm=0;TC.par.isBlock=false;TC.par.parFired=false;return;}
      const bd=GB.btns.dod;if(Math.hypot(tp.x-bd.x,tp.y-bd.y)<bd.r+12&&TC.dod.id===null){TC.dod.id=t.identifier;TC.dod.fired=false;return;}
      const bs=GB.btns.skl;if(Math.hypot(tp.x-bs.x,tp.y-bs.y)<bs.r+12&&TC.skl.id===null){TC.skl.id=t.identifier;TC.skl.fired=false;return;}
      if(tp.x<W*.5&&TC.joy.id===null){TC.joy.id=t.identifier;TC.joy.on=true;TC.joy.ox=tp.x;TC.joy.oy=tp.y;TC.joy.dx=0;TC.joy.dy=0;return;}
    }
    M.x=tp.x;M.y=tp.y;M.ck=true;
  });
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t=>{
    if(t.identifier===TC.joy.id){const tp=tPos(t),rx=tp.x-TC.joy.ox,ry=tp.y-TC.joy.oy,d=Math.hypot(rx,ry);TC.joy.dx=rx/Math.max(d,1)*Math.min(1,d/JOY.outerR);TC.joy.dy=ry/Math.max(d,1)*Math.min(1,d/JOY.outerR);}
    if(G.scr!=='combat'&&G.scr!=='boss'){const tp=tPos(t);M.x=tp.x;M.y=tp.y;}
  });
},{passive:false});
function endT(t){
  if(t.identifier===TC.joy.id){TC.joy.id=null;TC.joy.on=false;TC.joy.dx=0;TC.joy.dy=0;}
  if(t.identifier===TC.atk.id)TC.atk.id=null;
  if(t.identifier===TC.par.id){TC.par.touchCd=TC.par.isBlock?180:PAR_TOUCH_DELAY;TC.par.on=false;TC.par.id=null;}
  if(t.identifier===TC.dod.id)TC.dod.id=null;
  if(t.identifier===TC.skl.id)TC.skl.id=null;
}
cv.addEventListener('touchend',e=>{e.preventDefault();Array.from(e.changedTouches).forEach(endT);},{passive:false});
cv.addEventListener('touchcancel',e=>{e.preventDefault();Array.from(e.changedTouches).forEach(endT);},{passive:false});

function applyMobile(dt){
  const inC=G.scr==='combat'||G.scr==='boss';if(!inC)return;
  const p=G.player;if(!p||p.state==='dead')return;
  if(TC.par.touchCd>0)TC.par.touchCd=Math.max(0,TC.par.touchCd-dt*1000);
  // 조이스틱 이동
  if(TC.joy.on&&(Math.abs(TC.joy.dx)>.08||Math.abs(TC.joy.dy)>.08)){
    if(p.state!=='attacking'&&p.state!=='hurt'&&p.state!=='dodging'){
      const sp=p.spd*(p.state==='blocking'?.4:1);p.x+=TC.joy.dx*sp;p.y+=TC.joy.dy*sp;p.face={x:TC.joy.dx,y:TC.joy.dy};clampP(p);
    }
  }
  // 공격
  if(TC.atk.id!==null&&!TC.atk.fired){TC.atk.fired=true;if(p.state==='idle'&&p.atkTm<=0){
    const tgts=(G.scr==='boss'?[G.boss]:G.enemies).filter(e=>e&&e.state!=='dead');
    if(tgts.length){let near=tgts[0],nd=Infinity;tgts.forEach(e=>{const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<nd){nd=d;near=e;}});const dx=near.x-p.x,dy=near.y-p.y,dist=Math.hypot(dx,dy)||1;p.face={x:dx/dist,y:dy/dist};}
    p.state='attacking';p.stTm=p.atkCd*.5;p.atkTm=p.atkCd;doPlayerAttack(p);
  }}
  // 패링/방어
  if(TC.par.on){
    TC.par.tm+=dt*1000;
    if(TC.par.tm>=220){TC.par.isBlock=true;if(p.state==='idle'||p.state==='blocking'){p.state='blocking';p.st=Math.max(0,p.st-8*dt);if(p.st<=0){p.state='idle';p.parAct=false;}}}
    else if(!TC.par.parFired){TC.par.parFired=true;if(p.state==='idle'&&p.parCd<=0){p.parAct=true;p.parTm=p.parW;dust(p.x,p.y,'#ffff88',3);}}
  }else{if(TC.par.isBlock&&p.state==='blocking'){p.state='idle';p.parAct=false;}TC.par.isBlock=false;}
  // 회피
  if(TC.dod.id!==null&&!TC.dod.fired){TC.dod.fired=true;if(p.st>=p.pCost&&p.state==='idle'){
    const dx=TC.joy.on?TC.joy.dx:p.face.x,dy=TC.joy.on?TC.joy.dy:p.face.y,l=Math.hypot(dx,dy)||1;
    p.dvx=dx/l*265;p.dvy=dy/l*265;p.state='dodging';p.stTm=280;p.inv=true;p.invTm=260;p.st-=p.pCost;dust(p.x,p.y,'#8888ff',5);
  }}
  // 스킬
  if(p.cid==='mage'){if(TC.skl.id!==null){if(!p.skillLocked){p.skillActive=true;if(!TC.skl.fired)TC.skl.fired=true;}else p.skillActive=false;}}
  else{if(TC.skl.id!==null&&!TC.skl.fired){TC.skl.fired=true;if(p.state==='idle'||p.state==='attacking')doPlayerSkill(p);}}
}

// ═══════════════════════════════════════
// 메인 루프
// ═══════════════════════════════════════
function loop(ts){
  G.dt=Math.min((ts-(G.lt||ts))/1000,.05);G.lt=ts;G.t=ts;
  applyMobile(G.dt);update();render();
  for(const k in JP)delete JP[k];M.ck=false;
  requestAnimationFrame(loop);
}

initG();
_loadBgm();
initSprites().then(()=>requestAnimationFrame(loop));
